<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bloc de Notas - Llamadas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #f8fafc;
        }
        
        .notepad-container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            position: relative;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            height: 400px;
        }
        
        .notepad-container:focus-within {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .notepad-textarea {
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(transparent, transparent 31px, #f3f4f6 31px, #f3f4f6 32px);
            line-height: 32px;
            padding: 8px 16px 8px 48px;
            border: none;
            resize: none;
            outline: none;
            background-color: transparent;
            color: #374151;
        }

        .notepad-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 36px;
            width: 1px;
            background-color: rgba(239, 68, 68, 0.25);
            z-index: 0;
        }

        .notepad-textarea {
            position: relative;
            z-index: 1;
        }

        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-6 lg:p-8 min-h-screen flex flex-col">

    <div class="w-full max-w-6xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- PANEL IZQUIERDO: Bloc de Notas e Historial -->
        <div class="flex-grow flex flex-col gap-6 lg:w-2/3">
            
            <!-- Cabecera del Bloc de Notas -->
            <div class="bg-white p-3 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4 border border-gray-100">
                <h1 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-blue-500"></i> Bloc de Notas
                </h1>
                
                <div class="flex items-center gap-2">
                    <button id="btnNewNote" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-1.5 px-3 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Nueva Nota
                    </button>
                    <button id="btnDeleteNote" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-sm font-medium py-1.5 px-3 rounded-lg transition-colors flex items-center gap-2">
                        <i class="fa-regular fa-trash-can"></i> Borrar
                    </button>
                </div>
            </div>

            <!-- Área de Texto Principal -->
            <div class="notepad-container">
                <textarea id="mainNotepad" class="notepad-textarea text-sm" spellcheck="false" placeholder="Escribe aquí..."></textarea>
            </div>

            <!-- Tabla de Historial de Notas -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col mb-8">
                <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2 uppercase tracking-wide mb-3">
                    <i class="fa-solid fa-clock-rotate-left text-gray-400"></i> Historial de Notas
                </h2>
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-left border-collapse min-w-[300px]">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs uppercase tracking-wider">
                                <th class="py-2 px-4 font-semibold w-24">Fecha</th>
                                <th class="py-2 px-4 font-semibold">Título (Primera línea)</th>
                            </tr>
                        </thead>
                        <tbody id="notesTableBody" class="text-sm">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>

        <!-- PANEL DERECHO: Plantillas de Respuesta -->
        <div class="lg:w-1/3 flex flex-col gap-4">
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sticky top-6">
                <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                    <h2 class="text-md font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-yellow-500"></i> Respuestas Rápidas
                    </h2>
                    
                    <label class="flex items-center gap-2 cursor-pointer hover:bg-gray-50 p-1.5 rounded border border-gray-200 transition-colors">
                        <input type="checkbox" id="chkIdiomaPT" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer"> 
                        <span class="text-sm font-bold text-gray-700">PT</span>
                    </label>
                </div>
                
                <!-- Plantilla A: Escalar -->
                <div class="mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">1. Escalar</h3>
                    <button id="btnCopyEscalar" class="w-full bg-white border border-gray-300 text-gray-700 hover:text-indigo-600 hover:border-indigo-400 text-sm font-medium py-2 px-3 rounded-md shadow-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-regular fa-copy"></i> Copiar Respuesta Escalar
                    </button>
                </div>

                <!-- Plantilla Nueva: Envío de Documento -->
                <div class="mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">2. Envío de Documento</h3>
                    <button id="btnCopyEnvioDoc" class="w-full bg-white border border-gray-300 text-gray-700 hover:text-indigo-600 hover:border-indigo-400 text-sm font-medium py-2 px-3 rounded-md shadow-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-regular fa-copy"></i> Copiar Envío de Documento
                    </button>
                </div>

                <!-- Plantilla B: Solicitud de Información -->
                <div class="mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">3. Solicitud de Información</h3>
                    
                    <div class="flex flex-col gap-1.5 mb-3 text-sm text-gray-700" id="reqInfoCheckboxes">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="contexto" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer"> 
                            <span class="lbl-contexto">Mas contexto</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="registro" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer"> 
                            <span class="lbl-registro">Nro de Registro</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="transaccion" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer"> 
                            <span class="lbl-transaccion">Transaccion</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="print" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer"> 
                            <span class="lbl-print">Print de pantalla del error</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="pasos" class="w-4 h-4 text-blue-600 rounded border-gray-300 cursor-pointer"> 
                            <span class="lbl-pasos">Una breve descripcion de los pasos realizados</span>
                        </label>
                    </div>

                    <button id="btnCopyReqInfo" class="w-full bg-white border border-gray-300 text-gray-700 hover:text-blue-600 hover:border-blue-400 text-sm font-medium py-2 px-3 rounded-md shadow-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-regular fa-copy"></i> Copiar Solicitud
                    </button>
                </div>

                <!-- Plantilla C: Solución -->
                <div class="mb-4 bg-gray-50 p-3 rounded-lg border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">4. Solución</h3>
                    <button id="btnCopySolucion" class="w-full bg-white border border-gray-300 text-gray-700 hover:text-green-600 hover:border-green-400 text-sm font-medium py-2 px-3 rounded-md shadow-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-regular fa-copy"></i> Copiar Solución
                    </button>
                </div>
                
            </div>
            
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2 text-sm font-medium">
        <i class="fa-solid fa-circle-check text-green-400"></i> <span id="toastMsg">¡Copiado!</span>
    </div>

    <script>
        // State
        let notes = [];
        let currentNoteIndex = 0;

        // Elements
        const mainNotepad = document.getElementById('mainNotepad');
        const btnNewNote = document.getElementById('btnNewNote');
        const btnDeleteNote = document.getElementById('btnDeleteNote');
        const notesTableBody = document.getElementById('notesTableBody');
        const chkIdiomaPT = document.getElementById('chkIdiomaPT');
        
        // Template Buttons
        const btnCopyEscalar = document.getElementById('btnCopyEscalar');
        const btnCopyEnvioDoc = document.getElementById('btnCopyEnvioDoc');
        const btnCopyReqInfo = document.getElementById('btnCopyReqInfo');
        const btnCopySolucion = document.getElementById('btnCopySolucion');
        const reqInfoCheckboxes = document.querySelectorAll('#reqInfoCheckboxes input[type="checkbox"]');

        // Toast
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        let toastTimeout;

        // Initialization
        function initApp() {
            const savedNotes = localStorage.getItem('bloc_llamadas_notes');
            const savedIndex = localStorage.getItem('bloc_llamadas_index');
            
            if (savedNotes) {
                try {
                    notes = JSON.parse(savedNotes);
                    if (!Array.isArray(notes)) notes = [];
                } catch (e) {
                    notes = [];
                }
            }
            
            if (notes.length === 0) {
                createNewNote();
            }

            if (savedIndex !== null && !isNaN(savedIndex) && savedIndex >= 0 && savedIndex < notes.length) {
                currentNoteIndex = parseInt(savedIndex);
            } else {
                currentNoteIndex = 0;
            }

            setupEventListeners();
            updateUI();
        }

        function createNewNote() {
            notes.unshift({
                content: "",
                createdAt: new Date().toISOString()
            });
            currentNoteIndex = 0;
            saveState();
        }

        function saveState() {
            localStorage.setItem('bloc_llamadas_notes', JSON.stringify(notes));
            localStorage.setItem('bloc_llamadas_index', currentNoteIndex);
        }

        function renderTable() {
            notesTableBody.innerHTML = '';
            
            notes.forEach((note, idx) => {
                const dateObj = new Date(note.createdAt);
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const time = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                const dateStr = `${day}/${month} ${time}`;
                
                const lines = (note.content || "").split('\n').filter(line => line.trim() !== '');
                const firstLine = lines.length > 0 ? lines[0].trim() : '(Nueva nota sin título)';
                const displayTitle = firstLine.length > 70 ? firstLine.substring(0, 70) + '...' : firstLine;
                
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-100 hover:bg-blue-50 cursor-pointer transition-colors ${idx === currentNoteIndex ? 'bg-blue-100' : 'bg-white'}`;
                
                tr.onclick = () => {
                    currentNoteIndex = idx;
                    updateUI();
                    saveState();
                };
                
                tr.innerHTML = `
                    <td class="py-2.5 px-4 text-gray-500 font-medium whitespace-nowrap text-xs">${dateStr}</td>
                    <td class="py-2.5 px-4 text-gray-800 font-medium">${displayTitle}</td>
                `;
                notesTableBody.appendChild(tr);
            });
        }

        function updateUI() {
            if (notes.length > 0) {
                mainNotepad.value = notes[currentNoteIndex].content || "";
            } else {
                mainNotepad.value = "";
            }
            renderTable();
        }

        function showToast(msg) {
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function copyToClipboard(text) {
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = text;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                if (document.execCommand('copy')) {
                    showToast("¡Texto copiado!");
                }
            } catch (err) {
                console.error('Error copiando', err);
            }
            
            document.body.removeChild(tempTextArea);
        }

        // --- Template Generation Logic ---

        function getGreeting(isPT) {
            const hour = new Date().getHours();
            if (isPT) {
                return hour < 12 ? "Bom dia," : "Boa tarde,";
            } else {
                return hour < 12 ? "Buenos dias," : "Buenas tardes,";
            }
        }

        function getEscalarText(isPT) {
            const greeting = getGreeting(isPT);
            if (isPT) {
                return `${greeting}\n\nInformamos que o seu caso está a ser analisado. Responderemos com uma solução em breve.\n\nCom os melhores cumprimentos,`;
            } else {
                return `${greeting}\n\nInformamos que su caso esta siendo análizado, en breve estaremos respondiendo resolutivamente.\n\nSaludos`;
            }
        }

        function getEnvioDocText(isPT) {
            const greeting = getGreeting(isPT);
            if (isPT) {
                return `${greeting}\n\nEm anexo encontrará a informação solicitada.\n\nCom os melhores cumprimentos,`;
            } else {
                return `${greeting}\n\nEn el anexo encontrara la informacion solicitada.\n\nSaludos`;
            }
        }

        function getSolucionText(isPT) {
            const greeting = getGreeting(isPT);
            if (isPT) {
                return `${greeting}\n\nInformamos que finalizámos o seu pedido. Podem avançar.\n\nCom os melhores cumprimentos,`;
            } else {
                return `${greeting}\n\nInformamos que hemos finalizado su solicitud, pueden avanzar.\n\nSaludos`;
            }
        }

        function getReqInfoText(isPT, checkedValues) {
            const greeting = getGreeting(isPT);
            
            const reqMapES = {
                'contexto': 'Mas contexto',
                'registro': 'Nro de Registro',
                'transaccion': 'Transaccion',
                'print': 'Print de pantalla del error',
                'pasos': 'Una breve descripcion de los pasos realizados'
            };
            
            const reqMapPT = {
                'contexto': 'Mais contexto',
                'registro': 'N.º de Registo',
                'transaccion': 'Transação',
                'print': 'Captura de ecrã do erro',
                'pasos': 'Uma breve descrição dos passos realizados'
            };

            const mapToUse = isPT ? reqMapPT : reqMapES;
            
            let bullets = "";
            checkedValues.forEach(val => {
                if (mapToUse[val]) {
                    bullets += `- ${mapToUse[val]}\n`;
                }
            });

            if (isPT) {
                return `${greeting}\n\nPara darmos seguimento ao seu caso, necessitamos que nos forneça mais informações, incluindo:\n\n${bullets}\nAguardamos o vosso feedback para os podermos ajudar.\n\nCom os melhores cumprimentos,`;
            } else {
                return `${greeting}\n\nPara dar continuidad a su caso necesitamos nos amplien la información incluyendo:\n\n${bullets}\nAguardamos feedback para ayudarles.\n\nSaludos`;
            }
        }

        function setupEventListeners() {
            // Notepad Logic
            mainNotepad.addEventListener('input', () => {
                if (notes.length > 0) {
                    notes[currentNoteIndex].content = mainNotepad.value;
                    saveState();
                    renderTable();
                }
            });

            btnNewNote.addEventListener('click', () => {
                createNewNote();
                updateUI();
            });

            btnDeleteNote.addEventListener('click', () => {
                if (notes.length > 1) {
                    notes.splice(currentNoteIndex, 1);
                    if (currentNoteIndex >= notes.length) {
                        currentNoteIndex = notes.length - 1;
                    }
                } else {
                    notes[0].content = "";
                    notes[0].createdAt = new Date().toISOString();
                }
                saveState();
                updateUI();
                showToast("Nota eliminada");
            });

            // Template Buttons Logic
            btnCopyEscalar.addEventListener('click', () => {
                const isPT = chkIdiomaPT.checked;
                copyToClipboard(getEscalarText(isPT));
            });

            btnCopyEnvioDoc.addEventListener('click', () => {
                const isPT = chkIdiomaPT.checked;
                copyToClipboard(getEnvioDocText(isPT));
            });

            btnCopySolucion.addEventListener('click', () => {
                const isPT = chkIdiomaPT.checked;
                copyToClipboard(getSolucionText(isPT));
            });

            btnCopyReqInfo.addEventListener('click', () => {
                const isPT = chkIdiomaPT.checked;
                const checkedValues = Array.from(reqInfoCheckboxes)
                                           .filter(chk => chk.checked)
                                           .map(chk => chk.value);
                
                if (checkedValues.length === 0) {
                    alert(isPT ? "Por favor, selecione pelo menos uma opção." : "Por favor, selecciona al menos una opción.");
                    return;
                }
                
                copyToClipboard(getReqInfoText(isPT, checkedValues));
            });

            // Actualizar etiquetas de checkboxes si cambia el idioma
            chkIdiomaPT.addEventListener('change', () => {
                const isPT = chkIdiomaPT.checked;
                document.querySelector('.lbl-contexto').innerText = isPT ? 'Mais contexto' : 'Mas contexto';
                document.querySelector('.lbl-registro').innerText = isPT ? 'N.º de Registo' : 'Nro de Registro';
                document.querySelector('.lbl-transaccion').innerText = isPT ? 'Transação' : 'Transaccion';
                document.querySelector('.lbl-print').innerText = isPT ? 'Captura de ecrã do erro' : 'Print de pantalla del error';
                document.querySelector('.lbl-pasos').innerText = isPT ? 'Uma breve descrição dos passos realizados' : 'Una breve descripcion de los pasos realizados';
            });
        }

        // Run
        window.onload = initApp;
    </script>
</body>
</html>
