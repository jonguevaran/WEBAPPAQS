    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Fuente de programación monospace */
            font-family: 'JetBrains Mono', monospace;
            background-color: #f8fafc;
        }
        
        .notepad-container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            position: relative;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }
        
        .notepad-container:focus-within {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .notepad-textarea {
            width: 100%;
            /* Ligeras líneas grises de fondo */
            background-image: repeating-linear-gradient(transparent, transparent 31px, #f3f4f6 31px, #f3f4f6 32px);
            line-height: 32px;
            padding: 8px 16px 8px 48px;
            border: none;
            resize: none;
            outline: none;
            background-color: transparent;
            color: #374151;
        }

        .notepad-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 36px;
            width: 1px;
            background-color: rgba(239, 68, 68, 0.25); /* Línea roja suave */
            z-index: 0;
        }

        .notepad-textarea {
            position: relative;
            z-index: 1;
        }

        /* Ocultar barra de desplazamiento si no es necesaria */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>

<body class="text-gray-800 p-4 md:p-6 lg:p-8 min-h-screen flex flex-col">

    <div class="w-full max-w-4xl mx-auto mb-6">
        <div class="bg-white p-3 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4 border border-gray-100">
            
            <!-- Título y Navegación (Izquierda) -->
            <div class="flex items-center gap-4 order-first sm:order-none w-full sm:w-auto justify-between sm:justify-start">
                <h1 class="text-lg font-bold text-gray-800 flex items-center gap-2 min-w-max">
                    <i class="fa-solid fa-headset text-blue-500"></i> Incidencias
                </h1>
                
                <div class="flex items-center bg-gray-50 rounded-lg border border-gray-200 p-1">
                    <button id="btnPrev" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-all">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    
                    <span id="recordCounter" class="text-sm font-semibold text-gray-700 px-3 min-w-[60px] text-center">
                        1 / 1
                    </span>
                    
                    <button id="btnNext" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-all">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <!-- Botones de Acción (Derecha) -->
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <!-- Botón para instalar PWA (Oculto por defecto hasta que el navegador lo permita) -->
                <button id="btnInstall" title="Instalar Aplicación en el PC" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-1.5 px-3 rounded-lg shadow-sm transition-colors flex items-center gap-2 hidden">
                    <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Instalar App</span>
                </button>

                <button id="btnNew" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-1.5 px-3 rounded-lg shadow-sm transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo</span>
                </button>
                
                <button id="btnReset" title="Restablecer registro" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium py-1.5 px-3 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline">Restablecer</span>
                </button>

                <button id="btnDelete" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-sm font-medium py-1.5 px-3 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-regular fa-trash-can"></i> Ok
                </button>
            </div>
            
        </div>
    </div>

    <div class="flex flex-col gap-6 w-full max-w-4xl mx-auto flex-grow">
        
        <!-- Textarea 1: Datos del Contacto -->
        <div class="flex flex-col relative">
            <div class="flex justify-between items-end mb-2 px-1">
                <label class="font-semibold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-user-pen text-gray-400"></i> Datos del contacto
                </label>
                <button onclick="copyContent('ta1')" class="bg-white border border-gray-200 text-gray-700 hover:text-blue-600 hover:border-blue-300 text-xs font-medium py-1.5 px-3 rounded-md shadow-sm flex items-center gap-2 transition-colors">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>
            <div class="notepad-container">
                <textarea id="ta1" class="notepad-textarea overflow-hidden text-sm" spellcheck="false"></textarea>
            </div>
        </div>

        <!-- Textarea 2: Proceso (con Checkboxes) -->
        <div class="flex flex-col relative">
            <div class="flex flex-wrap justify-between items-end mb-2 px-1 gap-2">
                <div class="flex flex-wrap items-center gap-4">
                    <label class="font-semibold text-gray-700 flex items-center gap-2">
                        <i class="fa-solid fa-envelope-open-text text-gray-400"></i> Proceso
                    </label>
                    
                    <!-- Checkboxes (Arriba) -->
                    <div class="flex items-center gap-3 text-sm font-medium text-gray-700 bg-white px-3 py-1 rounded-md border border-gray-200 shadow-sm">
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-gray-900 transition-colors">
                            <input type="checkbox" id="chkPt" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer"> 
                            Pt
                        </label>
                        <div class="w-px h-4 bg-gray-300"></div>                        
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-gray-900 transition-colors">
                            <input type="checkbox" id="chkRemota" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer"> 
                            Acceso Remoto
                        </label>
                        <div class="w-px h-4 bg-gray-300"></div>                        
                        <label class="flex items-center gap-1.5 cursor-pointer hover:text-gray-900 transition-colors">
                            <input type="checkbox" id="chkConfirmado" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer"> 
                            Confirmado
                        </label>
                    </div>
                </div>
            </div>
            <div class="notepad-container">
                <textarea id="ta2" class="notepad-textarea overflow-hidden text-sm" spellcheck="false" placeholder="Escriba aquí el resumen de su caso..."></textarea>
            </div>
            
            <!-- Botones de Acción (Abajo a la derecha) -->
            <div class="flex justify-end items-center gap-2 mt-3">
                <button onclick="copyRelatorio()" class="bg-white border border-gray-200 text-gray-700 hover:text-indigo-600 hover:border-indigo-300 text-xs font-medium py-1.5 px-3 rounded-md shadow-sm flex items-center gap-2 transition-colors">
                    <i class="fa-regular fa-copy"></i> Relatorio
                </button>
                <button onclick="copySeguimiento()" class="bg-white border border-gray-200 text-gray-700 hover:text-teal-600 hover:border-teal-300 text-xs font-medium py-1.5 px-3 rounded-md shadow-sm flex items-center gap-2 transition-colors">
                    <i class="fa-regular fa-copy"></i> Seguimiento
                </button>
                <button onclick="copyRespuesta()" class="bg-white border border-gray-200 text-gray-700 hover:text-blue-600 hover:border-blue-300 text-xs font-medium py-1.5 px-3 rounded-md shadow-sm flex items-center gap-2 transition-colors">
                    <i class="fa-regular fa-copy"></i> Respuesta
                </button>
            </div>
        </div>

        <!-- Campo Link Ticket -->
        <div class="mt-2 bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col">
            <label class="font-semibold text-gray-700 flex items-center gap-2 mb-2">
                <i class="fa-solid fa-link text-gray-400"></i> Link Ticket
            </label>
            <input type="text" id="ticketLink" placeholder="Ej: https://aquaservice.atlassian.net/browse/..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent font-['JetBrains_Mono']">
        </div>

        <!-- Tabla de Registros -->
        <div class="mt-2 bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col mb-8">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2 uppercase tracking-wide">
                    <i class="fa-solid fa-table-list text-gray-400"></i> Historial de Registros
                </h2>
                <button id="btnClearAll" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs font-medium py-1.5 px-3 rounded-md transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-trash-arrow-up"></i> Restablecer
                </button>
            </div>
            <div class="overflow-x-auto rounded-lg border border-gray-200">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4 font-semibold w-24">Fecha</th>
                            <th class="py-3 px-4 font-semibold">Proceso (Primera Línea)</th>
                            <th class="py-3 px-4 font-semibold w-32 text-center">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="text-sm">
                        <!-- Filas generadas dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Confirmación Borrar Todo -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-gray-200 p-6 max-w-sm w-full text-center">
            <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-600 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">Restablecer Todo</h3>
            <p class="text-gray-600 text-sm mb-6">¿Estás seguro de que deseas eliminar <b>todos los registros</b> del historial? Esta acción no se puede deshacer.</p>
            <div class="flex gap-3 justify-center">
                <button id="btnCancelClear" class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm font-semibold py-2 px-4 rounded-lg transition-colors flex-1">Cancelar</button>
                <button id="btnConfirmClear" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors flex-1">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-2.5 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2 text-sm font-medium">
        <i class="fa-solid fa-circle-check text-green-400"></i> <span id="toastMsg">¡Copiado!</span>
    </div>

    <script>
        // PWA Setup: Registro de un Service Worker virtual para permitir la instalación
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function() {});`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW no registrado', err));
        }

        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstall');

        // Capturar el evento de instalación nativo
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); // Evitar el mini-infobar por defecto
            deferredPrompt = e; // Guardar evento
            // Mostrar nuestro botón de "Instalar App"
            if (btnInstall) {
                btnInstall.classList.remove('hidden');
            }
        });

        // Ocultar el botón si ya está instalada
        window.addEventListener('appinstalled', () => {
            if (btnInstall) btnInstall.classList.add('hidden');
            console.log('Aplicación instalada con éxito');
        });

        if (btnInstall) {
            btnInstall.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt(); // Mostrar pop-up del sistema
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        btnInstall.classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        }

        // Default Templates - Eliminados campos Iniciales y Tipo de incidencia
        const DEFAULT_TEXT_1 = `Nombre: \nDelegación: \nDepartamento/Rol: `;
        const DEFAULT_TEXT_2 = `El usuario indica que:\n`;

        // Application State
        let records = [];
        let currentIndex = 0;

        // DOM Elements
        const ta1 = document.getElementById('ta1');
        const ta2 = document.getElementById('ta2');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnNew = document.getElementById('btnNew');
        const btnReset = document.getElementById('btnReset');
        const btnDelete = document.getElementById('btnDelete');
        const recordCounter = document.getElementById('recordCounter');
        const chkPt = document.getElementById('chkPt');
        const chkRemota = document.getElementById('chkRemota');
        const chkConfirmado = document.getElementById('chkConfirmado');
        const ticketLink = document.getElementById('ticketLink');
        const btnClearAll = document.getElementById('btnClearAll');
        const confirmModal = document.getElementById('confirmModal');
        const btnConfirmClear = document.getElementById('btnConfirmClear');
        const btnCancelClear = document.getElementById('btnCancelClear');
        const tbody = document.getElementById('recordsTableBody');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        let toastTimeout;

        function initApp() {
            const saved = localStorage.getItem('incidenciasApp_records');
            const savedIndex = localStorage.getItem('incidenciasApp_index');

            if (saved) {
                try {
                    records = JSON.parse(saved);
                    // Ensure dates exist
                    records.forEach(rec => {
                        if (!rec.createdAt) rec.createdAt = new Date().toISOString();
                    });
                    if (records.length === 0) createNewRecord();
                } catch (e) {
                    createNewRecord();
                }
            } else {
                createNewRecord();
            }

            if (savedIndex !== null && !isNaN(savedIndex) && savedIndex >= 0 && savedIndex < records.length) {
                currentIndex = parseInt(savedIndex);
            } else {
                currentIndex = 0;
            }

            setupEventListeners();
            renderCurrentRecord();
        }

        function createNewRecord() {
            records.push({
                text1: DEFAULT_TEXT_1,
                text2: DEFAULT_TEXT_2,
                isPt: false,
                isRemota: false,
                isConfirmado: false,
                ticketLink: "",
                createdAt: new Date().toISOString()
            });
        }

        function saveState() {
            localStorage.setItem('incidenciasApp_records', JSON.stringify(records));
            localStorage.setItem('incidenciasApp_index', currentIndex);
        }

        // Auto Resize Textareas based on content
        function autoResize(element) {
            if(!element) return;
            
            element.style.height = '1px'; 
            let newHeight = element.scrollHeight;
            
            if (element.id === 'ta2') {
                newHeight = Math.max(150, newHeight);
            }
            
            element.style.height = newHeight + 'px';
        }

        function renderTable() {
            tbody.innerHTML = '';
            
            records.forEach((rec, idx) => {
                const dateObj = new Date(rec.createdAt);
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const dateStr = `${day}/${month}`;
                
                const lines = (rec.text2 || "").split('\n').filter(line => line.trim() !== '');
                const firstLine = lines.length > 0 ? lines[0].trim() : '(Sin contenido)';
                const displayTitle = firstLine.length > 55 ? firstLine.substring(0, 55) + '...' : firstLine;
                
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-100 hover:bg-blue-50 cursor-pointer transition-colors ${idx === currentIndex ? 'bg-blue-100' : 'bg-white'}`;
                
                tr.onclick = () => {
                    currentIndex = idx;
                    renderCurrentRecord();
                    saveState();
                };
                
                tr.innerHTML = `
                    <td class="py-2.5 px-4 text-gray-600 font-medium whitespace-nowrap">${dateStr}</td>
                    <td class="py-2.5 px-4 text-gray-800">${displayTitle}</td>
                    <td class="py-2.5 px-4 text-center">
                        ${rec.isConfirmado 
                            ? '<span class="inline-block px-2.5 py-1 bg-green-100 text-green-700 rounded-md text-xs font-bold w-full border border-green-200">Resuelto</span>' 
                            : '<span class="inline-block px-2.5 py-1 bg-amber-100 text-amber-700 rounded-md text-xs font-bold w-full border border-amber-200">Pendiente</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCurrentRecord() {
            const currentRec = records[currentIndex];
            
            ta1.value = currentRec.text1 || "";
            ta2.value = currentRec.text2 || "";
            chkPt.checked = !!currentRec.isPt;
            chkRemota.checked = !!currentRec.isRemota;
            chkConfirmado.checked = !!currentRec.isConfirmado;
            ticketLink.value = currentRec.ticketLink || "";

            recordCounter.innerText = `${currentIndex + 1} / ${records.length}`;

            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === records.length - 1;

            renderTable();

            setTimeout(() => {
                autoResize(ta1);
                autoResize(ta2);
            }, 10);
        }

        function setupEventListeners() {
            const handleInput = (e) => {
                records[currentIndex].text1 = ta1.value;
                records[currentIndex].text2 = ta2.value;
                records[currentIndex].isPt = chkPt.checked;
                records[currentIndex].isRemota = chkRemota.checked;
                records[currentIndex].isConfirmado = chkConfirmado.checked;
                records[currentIndex].ticketLink = ticketLink.value;
                saveState();
                
                if (e && e.target && (e.target === ta2 || e.target === chkPt)) {
                    renderTable();
                }
                
                if (e && e.target && (e.target === ta1 || e.target === ta2)) {
                    autoResize(e.target);
                }
            };

            ta1.addEventListener('input', handleInput);
            ta2.addEventListener('input', handleInput);
            chkPt.addEventListener('change', handleInput);
            ticketLink.addEventListener('input', handleInput);

            chkRemota.addEventListener('change', (e) => {
                const checked = e.target.checked;
                const remotaText = "Entramos remotamente al ordenador del cliente";
                let lines = ta2.value.split('\n');

                if (checked) {
                    if (!lines.includes(remotaText)) {
                        // Aseguramos que existan al menos 2 líneas
                        while (lines.length < 2) {
                            lines.push("");
                        }
                        // Insertar una línea en blanco en la 3ra fila (índice 2) y el texto en la 4ta (índice 3)
                        lines.splice(2, 0, "", remotaText);
                    }
                } else {
                    const idx = lines.indexOf(remotaText);
                    if (idx !== -1) {
                        lines.splice(idx, 1); // Quitar el texto
                        // Quitar también la línea en blanco que se insertó arriba (si está vacía)
                        if (idx > 0 && lines[idx - 1] === "") {
                            lines.splice(idx - 1, 1);
                        }
                    }
                }
                
                ta2.value = lines.join('\n');
                ta2.dispatchEvent(new Event('input', { bubbles: true }));
                records[currentIndex].isRemota = checked;
                saveState();
            });

            chkConfirmado.addEventListener('change', (e) => {
                const checked = e.target.checked;
                const confirmadoText = "El usuario confirma solucion de su pedido";
                let lines = ta2.value.split('\n');

                if (checked) {
                    if (!lines.includes(confirmadoText)) {
                        if (lines.length === 0 || (lines.length === 1 && lines[0].trim() === '')) {
                            lines = [confirmadoText];
                        } else {
                            lines.push(confirmadoText);
                        }
                    }
                } else {
                    const idx = lines.indexOf(confirmadoText);
                    if (idx !== -1) {
                        lines.splice(idx, 1);
                    }
                }
                
                ta2.value = lines.join('\n');
                ta2.dispatchEvent(new Event('input', { bubbles: true }));
                records[currentIndex].isConfirmado = checked;
                saveState();
            });

            window.addEventListener('resize', () => {
                autoResize(ta1);
                autoResize(ta2);
            });

            btnPrev.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCurrentRecord();
                    saveState();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentIndex < records.length - 1) {
                    currentIndex++;
                    renderCurrentRecord();
                    saveState();
                }
            });

            btnNew.addEventListener('click', () => {
                createNewRecord();
                currentIndex = records.length - 1;
                renderCurrentRecord();
                saveState();
            });

            btnReset.addEventListener('click', () => {
                records[currentIndex].text1 = DEFAULT_TEXT_1;
                records[currentIndex].text2 = DEFAULT_TEXT_2;
                records[currentIndex].isPt = false;
                records[currentIndex].isRemota = false;
                records[currentIndex].isConfirmado = false;
                records[currentIndex].ticketLink = "";
                renderCurrentRecord();
                saveState();
                showToast("Registro restaurado");
            });

            btnDelete.addEventListener('click', () => {
                if (records.length > 1) {
                    records.splice(currentIndex, 1);
                    if (currentIndex >= records.length) {
                        currentIndex = records.length - 1;
                    }
                } else {
                    records[0].text1 = DEFAULT_TEXT_1;
                    records[0].text2 = DEFAULT_TEXT_2;
                    records[0].isPt = false;
                    records[0].isRemota = false;
                    records[0].isConfirmado = false;
                    records[0].ticketLink = "";
                }
                renderCurrentRecord();
                saveState();
                showToast("Registro eliminado");
            });

            // Modal Borrar Todo
            btnClearAll.addEventListener('click', () => {
                confirmModal.classList.remove('hidden');
            });

            btnCancelClear.addEventListener('click', () => {
                confirmModal.classList.add('hidden');
            });

            btnConfirmClear.addEventListener('click', () => {
                records = [];
                createNewRecord();
                currentIndex = 0;
                saveState();
                renderCurrentRecord();
                confirmModal.classList.add('hidden');
                showToast("Todos los registros eliminados");
            });
        }

        function showToast(msg) {
            toastMsg.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function copyContent(elementId) {
            const textArea = document.getElementById(elementId);
            
            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = textArea.value;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                if (document.execCommand('copy')) showToast("¡Texto copiado!");
            } catch (err) {
                console.error('Error copiando', err);
            }
            
            document.body.removeChild(tempTextArea);
            textArea.focus();
        }

        function copySeguimiento() {
            const pt = chkPt.checked;

            const horaActual = new Date().getHours();
            
            let saludo;
            let finalStr;

            if (!pt) {
                saludo = horaActual < 12 ? "Buen dia" : "Buenas tardes";
                finalStr = `${saludo}\n\nInformamos que hemos escalado su caso para análisis y corrección, una vez nos confirmen estaremos respondiendo resolutivamente.\n\nSaludos`;
            } else {
                saludo = horaActual < 12 ? "Bom dia" : "Boa tarde";
                finalStr = `${saludo}\n\nEncaminhamos o seu caso para análise e correção. Responderemos assim que recebermos a confirmação.\n\nCom os melhores cumprimentos,`;
            }

            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = finalStr;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                if (document.execCommand('copy')) showToast("¡Seguimiento copiado!");
            } catch (err) {
                console.error('Error copiando', err);
            }
            
            document.body.removeChild(tempTextArea);
            ta2.focus();
        }

        function copyRespuesta() {
            const pt = chkPt.checked;

            const horaActual = new Date().getHours();
            
            let saludo;
            let finalStr;

            if (!pt) {
                saludo = horaActual < 12 ? "Buen dia" : "Buenas tardes";
                finalStr = `${saludo}\n\nInformamos que luego de realizar un análisis y seguimiento de su caso el mismo se encuentra corregido.\n\n`;
                finalStr += `Saludos`;
            } else {
                saludo = horaActual < 12 ? "Bom dia." : "Boa tarde.";
                finalStr = `${saludo}\n\nInformamos que, após análise e acompanhamento do seu caso, ele foi resolvido.\n\n`;
                finalStr += `Se precisar de ajuda com outro assunto, pode solicitá-la através do canal:\nhttps://aquaservice.atlassian.net/servicedesk/customer/portal/1/group/14\n\n`;
                finalStr += `Com os melhores cumprimentos,`;
            }

            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = finalStr;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                if (document.execCommand('copy')) showToast("¡Respuesta copiada!");
            } catch (err) {
                console.error('Error copiando', err);
            }
            
            document.body.removeChild(tempTextArea);
            ta2.focus();
        }

        function copyRelatorio() {
            const t2 = ta2.value;

            // Relatorio ignora el check Pt y no incluye saludos ni links
            let finalStr = `Resumen del caso:\n\n${t2}`;

            const tempTextArea = document.createElement("textarea");
            tempTextArea.value = finalStr;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            
            try {
                if (document.execCommand('copy')) showToast("¡Relatorio copiado!");
            } catch (err) {
                console.error('Error copiando', err);
            }
            
            document.body.removeChild(tempTextArea);
            ta2.focus();
        }

        // Iniciar
        window.onload = initApp;
    </script>
