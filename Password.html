<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Claves Fonéticas Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .password-display {
            font-family: 'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.05em;
        }
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body class="text-slate-800">

    <div class="glass-card w-full max-w-md p-8 text-center space-y-6 border border-slate-200">
        <header>
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl mb-4 border border-indigo-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-800 text-slate-900 mb-1">Clave Fonética Pro</h1>
            <p class="text-slate-500 text-sm">Símbolos permitidos: <b>. _ ! ? $</b></p>
        </header>

        <div class="relative">
            <div id="password-container" class="password-display bg-slate-50 border-2 border-slate-200 rounded-xl p-6 text-xl md:text-2xl font-bold text-indigo-700 break-all min-h-[80px] flex items-center justify-center transition-all shadow-inner">
                Generando...
            </div>
            <button id="copy-btn" class="absolute -top-3 -right-3 bg-indigo-600 text-white p-2.5 rounded-full shadow-lg hover:bg-indigo-700 active:scale-90 transition-all hidden" title="Copiar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                </svg>
            </button>
        </div>

        <div id="status-msg" class="text-xs font-semibold text-emerald-600 h-4 opacity-0 transition-opacity">
            Copiado al portapapeles
        </div>

        <button onclick="generate()" class="btn-hover w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 text-lg">
            Generar Nueva Clave
        </button>

        <div class="pt-6 border-t border-slate-100">
            <div class="grid grid-cols-2 gap-4 text-left">
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Caracteres</p>
                    <p class="text-xs font-semibold text-slate-700">12 a 15 máx.</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Legibilidad</p>
                    <p class="text-xs font-semibold text-slate-700">Sin I, l, 1, O, 0</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const components = [
            "ba", "be", "bu", "ca", "ce", "cu", "da", "de", "du", "fa", "fe", "fu", "ga", "ge", "gu", "ha", "he", "hu", "ja", "je",
            "ju", "ka", "ke", "ku", "ma", "me", "mu", "na", "ne", "nu", "pa", "pe", "pu", "qa", "qe", "qu", "ra", "re", "ru", "sa",
            "se", "su", "ta", "te", "tu", "va", "ve", "vu", "wa", "we", "wu", "xa", "xe", "xu", "ya", "ye", "yu", "za", "ze", "zu",
            "bra", "bre", "bru", "cra", "cre", "cru", "dra", "dre", "dru", "fra", "fre", "fru", "gra", "gre", "gru", "pra", "pre", "pru",
            "tra", "tre", "tru", "vrea", "vru", "sma", "sme", "smu", "ste", "stu", "que", "tra", "tre", "tru", "za", "zu", "gne", "gna",
            "pne", "pnu", "psa", "pse", "psu", "rva", "rve", "rvu", "sca", "sce", "scu"
        ];
        
        // Simbolos permitidos en general
        const specialPool = [".", "_", "!", "?", "$"];
        // Simbolos permitidos para el FINAL (sin el punto)
        const endSpecialPool = ["_", "!", "?", "$"];
        
        // Números permitidos (excluyendo 1 y 0)
        const numberPool = ["2", "3", "4", "5", "6", "7", "8", "9"];

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generate() {
            // 1. Seleccionamos 5 pares fonéticos aleatorios
            let pairs = [];
            for (let i = 0; i < 5; i++) {
                pairs.push(getRandom(components));
            }

            // 2. Primera letra en mayúscula
            pairs[0] = pairs[0].charAt(0).toUpperCase() + pairs[0].slice(1);

            // 3. Seleccionamos caracteres especiales (validando el final)
            const spec1 = getRandom(specialPool);
            const spec2 = getRandom(endSpecialPool); // Nunca será punto

            // 4. Generamos secuencia de 4 números
            let nums = "";
            for (let i = 0; i < 4; i++) {
                nums += getRandom(numberPool);
            }

            // 5. Construcción estructural:
            // [4 Pares] + [Especial 1] + [5to Par] + [Números] + [Especial 2]
            let p1to4 = pairs.slice(0, 4).join("");
            let p5 = pairs[4];
            
            let password = p1to4 + spec1 + p5 + nums + spec2;

            // Si excede 15 caracteres, ajustamos reduciendo números primero
            if (password.length > 15) {
                let diff = password.length - 15;
                let availableNums = nums.length;
                
                // Mantenemos al menos un número por seguridad
                let finalNumsCount = Math.max(1, availableNums - diff);
                let finalNums = nums.substring(0, finalNumsCount);
                
                password = p1to4 + spec1 + p5 + finalNums + spec2;

                // Si aún así excede 15 (por silabas largas), recortamos del bloque fonético principal
                if (password.length > 15) {
                    let over = password.length - 15;
                    password = p1to4.substring(0, p1to4.length - over) + spec1 + p5 + finalNums + spec2;
                }
            }

            // Asegurar longitud mínima de 12
            while (password.length < 12) {
                // Insertamos un número extra antes del especial final
                password = password.slice(0, -1) + getRandom(numberPool) + password.slice(-1);
            }

            const display = document.getElementById('password-container');
            display.innerText = password;
            document.getElementById('copy-btn').classList.remove('hidden');
        }

        document.getElementById('copy-btn').onclick = function() {
            const text = document.getElementById('password-container').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const status = document.getElementById('status-msg');
            status.style.opacity = '1';
            setTimeout(() => { status.style.opacity = '0'; }, 2000);
        };
        
        window.onload = generate;
    </script>
</body>
</html>
