<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="menu_llamadas">Bloc de Notas - Llamadas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: transparent;
        }
        
        .notepad-container {
            background-color: #ffffff !important;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            position: relative;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            height: 728px;
        }
        
        .notepad-container:focus-within {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .notepad-textarea {
            width: 100%;
            height: 100%;
            line-height: 1.5;
            padding: 16px;
            border: none;
            resize: none;
            outline: none;
            background-color: transparent;
            color: #000000 !important;
        }

        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-200 p-4 md:p-6 lg:p-8 min-h-screen flex flex-col bg-transparent">

    <div class="w-full max-w-4xl mx-auto flex flex-col gap-6">
        
        <!-- Bloc de Notas e Historial -->
        <div class="flex flex-col gap-6 w-full">
            <!-- Cabecera del Bloc de Notas -->
            <div class="glass p-3 rounded-xl shadow-sm flex flex-wrap justify-between items-center gap-4">
                <h1 class="text-lg font-bold flex items-center gap-2" data-i18n="llamadas_title">
                    <i class="fa-solid fa-book-open text-indigo-500"></i> Bloc de Notas
                </h1>
                
                <div class="flex items-center gap-2">
                    <button id="btnNewNote" class="bg-blue-200 hover:bg-blue-300 text-blue-900 dark:bg-blue-300 dark:hover:bg-blue-400 dark:text-blue-900 font-bold text-sm font-medium py-1.5 px-3 rounded-lg shadow-sm transition-colors flex items-center gap-2" data-i18n="llamadas_new_note">
                        <i class="fa-solid fa-plus"></i> Nueva Nota
                    </button>
                    <button id="btnDeleteNote" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-sm font-medium py-1.5 px-3 rounded-lg transition-colors flex items-center gap-2" data-i18n="llamadas_delete">
                        <i class="fa-regular fa-trash-can"></i> Borrar
                    </button>
                </div>
            </div>

            <!-- Área de Texto Principal -->
            <div class="notepad-container">
                <textarea id="mainNotepad" class="notepad-textarea text-sm" spellcheck="false" placeholder="Escribe aquí..." data-i18n="llamadas_placeholder"></textarea>
            </div>

            <!-- Tabla de Historial de Notas -->
            <div class="w-full glass p-4 rounded-xl shadow-sm flex flex-col mb-8">
                <h2 class="text-sm font-bold flex items-center gap-2 uppercase tracking-wide mb-3" data-i18n="llamadas_history">
                    <i class="fa-solid fa-clock-rotate-left text-gray-400"></i> Historial de Notas
                </h2>
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="w-full text-left border-collapse min-w-[300px]">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs uppercase tracking-wider">
                                <th class="py-2 px-4 font-semibold w-24" data-i18n="llamadas_col_date">Fecha</th>
                                <th class="py-2 px-4 font-semibold" data-i18n="llamadas_col_title">Título (Primera línea)</th>
                            </tr>
                        </thead>
                        <tbody id="notesTableBody" class="text-sm">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>

    </div>
        <script>
        // State
        let notes = [];
        let currentNoteIndex = 0;

        // Elements
        const mainNotepad = document.getElementById('mainNotepad');
        const btnNewNote = document.getElementById('btnNewNote');
        const btnDeleteNote = document.getElementById('btnDeleteNote');
        const notesTableBody = document.getElementById('notesTableBody');
        // Initialization
        function initApp() {
            const savedNotes = localStorage.getItem('bloc_llamadas_notes');
            const savedIndex = localStorage.getItem('bloc_llamadas_index');
            
            if (savedNotes) {
                try {
                    notes = JSON.parse(savedNotes);
                    if (!Array.isArray(notes)) notes = [];
                } catch (e) {
                    notes = [];
                }
            }
            
            if (notes.length === 0) {
                createNewNote();
            }

            if (savedIndex !== null && !isNaN(savedIndex) && savedIndex >= 0 && savedIndex < notes.length) {
                currentNoteIndex = parseInt(savedIndex);
            } else {
                currentNoteIndex = 0;
            }

            setupEventListeners();
            updateUI();
        }

        function createNewNote() {
            notes.unshift({
                content: "",
                createdAt: new Date().toISOString()
            });
            currentNoteIndex = 0;
            saveState();
        }

        function saveState() {
            localStorage.setItem('bloc_llamadas_notes', JSON.stringify(notes));
            localStorage.setItem('bloc_llamadas_index', currentNoteIndex);
        }

        function renderTable() {
            notesTableBody.innerHTML = '';
            
            notes.forEach((note, idx) => {
                const dateObj = new Date(note.createdAt);
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const time = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
                const dateStr = `${day}/${month} ${time}`;
                
                const lines = (note.content || "").split('\n').filter(line => line.trim() !== '');
                const firstLine = lines.length > 0 ? lines[0].trim() : '(Nueva nota sin título)';
                const displayTitle = firstLine.length > 70 ? firstLine.substring(0, 70) + '...' : firstLine;
                
                const tr = document.createElement('tr');
                tr.className = `border-b border-gray-100 hover:bg-indigo-50 cursor-pointer transition-colors ${idx === currentNoteIndex ? 'bg-indigo-100' : 'glass dark:border-slate-700'}`;
                
                tr.onclick = () => {
                    currentNoteIndex = idx;
                    updateUI();
                    saveState();
                };
                
                tr.innerHTML = `
                    <td class="py-2.5 px-4 text-gray-500 font-medium whitespace-nowrap text-xs">${dateStr}</td>
                    <td class="py-2.5 px-4 text-gray-800 font-medium">${displayTitle}</td>
                `;
                notesTableBody.appendChild(tr);
            });
        }

        function updateUI() {
            if (notes.length > 0) {
                mainNotepad.value = notes[currentNoteIndex].content || "";
            } else {
                mainNotepad.value = "";
            }
            renderTable();
        }

        function setupEventListeners() {
            // Notepad Logic
            mainNotepad.addEventListener('input', () => {
                if (notes.length > 0) {
                    notes[currentNoteIndex].content = mainNotepad.value;
                    saveState();
                    renderTable();
                }
            });

            btnNewNote.addEventListener('click', () => {
                createNewNote();
                updateUI();
            });

            btnDeleteNote.addEventListener('click', () => {
                if (notes.length > 1) {
                    notes.splice(currentNoteIndex, 1);
                    if (currentNoteIndex >= notes.length) {
                        currentNoteIndex = notes.length - 1;
                    }
                } else {
                    notes[0].content = "";
                    notes[0].createdAt = new Date().toISOString();
                }
                saveState();
                updateUI();
                // showToast eliminado
            });

            
        }

        // Run
        window.onload = initApp;
    </script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/core.js"></script>
</body>
</html>
