<!DOCTYPE html>
<html lang="es">
<head>
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_main">Página Principal - AQSWEBAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        html, body {
            min-height: 100%;
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100vh;
        }
        .menu-button {
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            position: relative;
            border: 2px solid transparent;
            box-sizing: border-box;
        }
        .menu-button:hover {
            transform: translateY(-2px);
        }
        .menu-button.active {
            border-color: #3b82f6;
        }
        .icon-button {
            width: 3.5rem;
            height: 3.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .menu-button::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            bottom: -2.4rem;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 0.35rem 0.7rem;
            font-size: 0.75rem;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: translateX(-50%) translateY(0.25rem);
            z-index: 10;
        }
        .menu-button:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .content-frame {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
        }
        .hidden-frame {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-indigo-100 dark:from-slate-900 dark:to-slate-800 text-slate-900 dark:text-slate-100 font-sans min-h-screen h-screen overflow-hidden transition-colors duration-300">
    <!-- Top Controls -->
    <div class="absolute top-4 right-4 flex gap-2 z-50">
        <button id="lang-toggle" class="glass rounded-full px-4 py-2 text-sm font-medium hover:bg-white/20 transition-all shadow-sm" data-i18n="toggle_lang">Mudar para Português</button>
        <button id="theme-toggle" class="glass rounded-full p-2 hover:bg-white/20 transition-all shadow-sm" title="Cambiar Tema" data-i18n="toggle_theme">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
            </svg>
        </button>
    </div>

    <div class="h-full max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
        <main class="flex-1 rounded-3xl glass p-4 flex flex-col min-h-0">
            <div class="mb-4 rounded-3xl glass p-4">
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <button class="menu-button icon-button rounded-2xl bg-white/20 hover:bg-white/40 dark:bg-black/20 dark:hover:bg-black/40 text-slate-600 dark:text-slate-300 transition-all" data-page="Llamadas.html" data-i18n="menu_llamadas" data-tooltip="Llamadas" title="Llamadas" aria-label="Llamadas">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.83 19.83 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.83 19.83 0 0 1 2.09 4.18 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.72c.12.81.35 1.6.68 2.34a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.74-1.14a2 2 0 0 1 2.11-.45c.74.33 1.53.56 2.34.68A2 2 0 0 1 22 16.92Z"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-white/20 hover:bg-white/40 dark:bg-black/20 dark:hover:bg-black/40 text-slate-600 dark:text-slate-300 shadow-sm" data-page="respuestas.html" data-i18n="menu_respuestas" data-tooltip="Respuestas" title="Respuestas Rápidas" aria-label="Respuestas Rápidas">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-white/20 hover:bg-white/40 dark:bg-black/20 dark:hover:bg-black/40 text-slate-600 dark:text-slate-300 shadow-sm" data-page="Altas.html" data-i18n="menu_altas" data-tooltip="Altas" title="Altas" aria-label="Altas">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-white/20 hover:bg-white/40 dark:bg-black/20 dark:hover:bg-black/40 text-slate-600 dark:text-slate-300 shadow-sm" data-page="DelegacionAlmacenes.html" data-i18n="menu_almacenes" data-tooltip="Almacenes" title="Almacenes" aria-label="Almacenes">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.75V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.75"/><path d="M12 3v4.5M3 9.75L12 4.5l9 5.25"/><path d="M7 12h3M14 12h3M7 16h3M14 16h3"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-white/20 hover:bg-white/40 dark:bg-black/20 dark:hover:bg-black/40 text-slate-600 dark:text-slate-300 shadow-sm" data-page="Password.html" data-i18n="menu_password" data-tooltip="Password" title="Password" aria-label="Password">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M12 16v1"/></svg>
                    </button>
                    <!-- Entregas moved to end -->
                    <button class="menu-button icon-button rounded-2xl bg-white/20 hover:bg-white/40 dark:bg-black/20 dark:hover:bg-black/40 text-slate-600 dark:text-slate-300 shadow-sm" data-page="entrega.html" data-i18n="menu_entrega" data-tooltip="Entrega" title="Entrega de Equipos" aria-label="Entrega de Equipos">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    </button>
                </div>
            </div>
            <div class="overflow-hidden rounded-3xl iframe-container p-0 flex-1 min-h-0">
                <div id="iframeContainer" class="h-full w-full min-h-0">
                    <iframe id="frame-Llamadas.html" class="content-frame w-full h-full" data-page="Llamadas.html" src="Llamadas.html" title="Llamadas"></iframe>
                    <iframe id="frame-respuestas.html" class="content-frame w-full h-full hidden-frame" data-page="respuestas.html" src="respuestas.html" title="Respuestas Rápidas"></iframe>
                    <iframe id="frame-Altas.html" class="content-frame w-full h-full hidden-frame" data-page="Altas.html" src="Altas.html" title="Altas"></iframe>
                    <iframe id="frame-DelegacionAlmacenes.html" class="content-frame w-full h-full hidden-frame" data-page="DelegacionAlmacenes.html" src="DelegacionAlmacenes.html" title="Almacenes"></iframe>
                    <iframe id="frame-Password.html" class="content-frame w-full h-full hidden-frame" data-page="Password.html" src="Password.html" title="Password"></iframe>
                    <iframe id="frame-entrega.html" class="content-frame w-full h-full hidden-frame" data-page="entrega.html" src="entrega.html" title="Entrega de Equipos"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script>
        const buttons = document.querySelectorAll('button[data-page]');
        const frames = document.querySelectorAll('iframe[data-page]');
        const storageKey = 'aqs-selected-page';

        function setActiveButton(activeButton) {
            buttons.forEach(btn => {
                btn.classList.remove('bg-blue-200', 'hover:bg-blue-300', 'text-blue-900', 'dark:text-blue-900', 'dark:bg-blue-300', 'dark:hover:bg-blue-400', 'active');
                btn.classList.add('bg-white/20', 'hover:bg-white/40', 'dark:bg-black/20', 'dark:hover:bg-black/40', 'text-slate-600', 'dark:text-slate-300');
            });
            activeButton.classList.remove('bg-white/20', 'hover:bg-white/40', 'dark:bg-black/20', 'dark:hover:bg-black/40', 'text-slate-600', 'dark:text-slate-300');
            activeButton.classList.add('bg-blue-200', 'hover:bg-blue-300', 'text-blue-900', 'dark:text-blue-900', 'dark:bg-blue-300', 'dark:hover:bg-blue-400', 'active');
        }

        function showPage(page) {
            frames.forEach(frame => {
                frame.classList.toggle('hidden-frame', frame.dataset.page !== page);
            });
            localStorage.setItem(storageKey, page);
            // Notify the newly visible iframe of the current language
            const currentLang = localStorage.getItem('lang') || 'es';
            const activeFrame = document.getElementById('frame-' + page);
            if (activeFrame && activeFrame.contentWindow) {
                setTimeout(() => {
                    try {
                        activeFrame.contentWindow.postMessage({ type: 'changeLang', lang: currentLang }, '*');
                    } catch(e) {}
                }, 150);
            }
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const page = button.dataset.page;
                setActiveButton(button);
                showPage(page);
            });
        });

        const savedPage = localStorage.getItem(storageKey) || 'Llamadas.html';
        const initialButton = Array.from(buttons).find(btn => btn.dataset.page === savedPage) || buttons[0];
        setActiveButton(initialButton);
        showPage(initialButton.dataset.page);

        // Keyboard navigation
        function handleKeyNavigation(e) {
            if (e.ctrlKey) {
                const key = e.key.toLowerCase();
                
                // Keep Ctrl + Arrows as they were without Shift
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    const buttonsArray = Array.from(buttons);
                    const currentIndex = buttonsArray.findIndex(btn => btn.classList.contains('active'));
                    if (currentIndex === -1) return;
                    
                    let newIndex = currentIndex;
                    if (e.key === 'ArrowLeft') {
                        newIndex = (currentIndex - 1 + buttonsArray.length) % buttonsArray.length;
                    } else if (e.key === 'ArrowRight') {
                        newIndex = (currentIndex + 1) % buttonsArray.length;
                    }
                    
                    buttonsArray[newIndex].click();
                    e.preventDefault();
                }
            }
        }
        
        document.addEventListener('keydown', handleKeyNavigation);

        frames.forEach(frame => {
            frame.addEventListener('load', () => {
                try {
                    frame.contentWindow.document.addEventListener('keydown', handleKeyNavigation);
                } catch(err) {
                    console.log("No se pudo añadir el evento de teclado al iframe:", err);
                }
            });
        });
    </script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/core.js"></script>
</body>
</html>
