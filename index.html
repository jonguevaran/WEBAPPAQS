<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - AQSWEBAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            min-height: 100%;
            height: 100%;
            margin: 0;
        }
        body {
            min-height: 100vh;
        }
        .menu-button {
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            position: relative;
        }
        .menu-button {
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            position: relative;
            border: 2px solid transparent;
            box-sizing: border-box;
        }
        .menu-button:hover {
            transform: translateY(-2px);
        }
        .menu-button.active {
            border-color: #3b82f6;
        }
        .icon-button {
            width: 3.5rem;
            height: 3.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .menu-button::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 50%;
            bottom: -2.4rem;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 0.35rem 0.7rem;
            font-size: 0.75rem;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: translateX(-50%) translateY(0.25rem);
            z-index: 10;
        }
        .menu-button:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .content-frame {
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
        }
        .hidden-frame {
            display: none !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen h-screen overflow-hidden">
    <div class="h-full max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-6">
        <main class="flex-1 rounded-3xl border border-slate-200 bg-white p-4 shadow-sm flex flex-col min-h-0">
            <div class="mb-4 rounded-3xl border border-slate-200 bg-slate-100 p-4">
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <button class="menu-button icon-button rounded-2xl bg-slate-700 text-white shadow-sm hover:bg-slate-800 active" data-page="Llamadas.html" data-tooltip="Llamadas" title="Llamadas" aria-label="Llamadas">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.83 19.83 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.83 19.83 0 0 1 2.09 4.18 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.72c.12.81.35 1.6.68 2.34a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.74-1.14a2 2 0 0 1 2.11-.45c.74.33 1.53.56 2.34.68A2 2 0 0 1 22 16.92Z"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-slate-900 text-white shadow-sm hover:bg-slate-800" data-page="Altas.html" data-tooltip="Altas" title="Altas" aria-label="Altas">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-slate-900 text-white shadow-sm hover:bg-slate-800" data-page="DelegacionAlmacenes.html" data-tooltip="Almacenes" title="Almacenes" aria-label="Almacenes">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.75V19a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9.75"/><path d="M12 3v4.5M3 9.75L12 4.5l9 5.25"/><path d="M7 12h3M14 12h3M7 16h3M14 16h3"/></svg>
                    </button>
                    <button class="menu-button icon-button rounded-2xl bg-slate-900 text-white shadow-sm hover:bg-slate-800" data-page="Password.html" data-tooltip="Password" title="Password" aria-label="Password">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M12 16v1"/></svg>
                    </button>
                </div>
            </div>
            <div class="overflow-hidden rounded-3xl border border-slate-200 bg-slate-50 p-0 flex-1 min-h-0">
                <div id="iframeContainer" class="h-full w-full min-h-0">
                    <iframe id="frame-Llamadas.html" class="content-frame bg-white h-full" data-page="Llamadas.html" src="Llamadas.html" title="Llamadas"></iframe>
                    <iframe id="frame-Altas.html" class="content-frame bg-white h-full hidden-frame" data-page="Altas.html" src="Altas.html" title="Altas"></iframe>
                    <iframe id="frame-DelegacionAlmacenes.html" class="content-frame bg-white h-full hidden-frame" data-page="DelegacionAlmacenes.html" src="DelegacionAlmacenes.html" title="Almacenes"></iframe>
                    <iframe id="frame-Password.html" class="content-frame bg-white h-full hidden-frame" data-page="Password.html" src="Password.html" title="Password"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script>
        const buttons = document.querySelectorAll('button[data-page]');
        const frames = document.querySelectorAll('iframe[data-page]');
        const storageKey = 'aqs-selected-page';

        function setActiveButton(activeButton) {
            buttons.forEach(btn => {
                btn.classList.remove('bg-slate-700');
                btn.classList.remove('active');
                btn.classList.add('bg-slate-900');
            });
            activeButton.classList.remove('bg-slate-900');
            activeButton.classList.add('bg-slate-700');
            activeButton.classList.add('active');
        }

        function showPage(page) {
            frames.forEach(frame => {
                frame.classList.toggle('hidden-frame', frame.dataset.page !== page);
            });
            localStorage.setItem(storageKey, page);
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const page = button.dataset.page;
                setActiveButton(button);
                showPage(page);
            });
        });

        const savedPage = localStorage.getItem(storageKey) || 'Llamadas.html';
        const initialButton = Array.from(buttons).find(btn => btn.dataset.page === savedPage) || buttons[0];
        setActiveButton(initialButton);
        showPage(initialButton.dataset.page);
    </script>
</body>
</html>
