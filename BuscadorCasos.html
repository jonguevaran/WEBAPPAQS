<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Casos - Helpdesk IT</title>
    <!-- Importar Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación suave para indicar error si el campo está vacío */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <!-- Contenedor Principal -->
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md transition-all duration-300 hover:shadow-2xl">
        
        <!-- Encabezado con Icono -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Helpdesk IT Aquaservice</h1>
            <p class="text-sm text-slate-500 mt-2">Introduce el número de caso para abrirlo directamente en Jira.</p>
        </div>

        <!-- Formulario de Entrada -->
        <div class="space-y-5">
            <div>
                <label for="numeroCaso" class="block text-sm font-medium text-slate-700 mb-1">Número de Caso (CAU)</label>
                <div class="relative mt-1 rounded-md shadow-sm">
                    <!-- Prefijo CAU- visual -->
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                        <span class="text-slate-500 sm:text-sm font-medium">CAU-</span>
                    </div>
                    <!-- Campo de texto: Usamos inputmode numeric para teclados móviles y forzamos solo números por JS -->
                    <input type="text" id="numeroCaso" inputmode="numeric" pattern="[0-9]*"
                        class="block w-full rounded-lg border-slate-300 pl-14 pr-4 py-3 text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 focus:outline-none sm:text-base bg-slate-50 border transition-colors" 
                        placeholder="Ej: 12345" 
                        autocomplete="off">
                </div>
                <p id="mensajeError" class="text-red-500 text-xs mt-2 hidden">Por favor, introduce un número de caso válido.</p>
            </div>

            <button id="btnAbrir" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                <span>Abrir en Jira</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </button>
        </div>
        
        <div class="mt-6 text-center">
            <span class="text-xs text-slate-400">Presiona <strong>Enter</strong> para buscar rápidamente</span>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputCaso = document.getElementById('numeroCaso');
            const btnAbrir = document.getElementById('btnAbrir');
            const mensajeError = document.getElementById('mensajeError');

            // Función principal para procesar y abrir la URL
            const procesarApertura = () => {
                let valor = inputCaso.value.trim();

                if (valor === '') {
                    // Mostrar error visual en lugar de un molesto alert()
                    inputCaso.classList.add('border-red-500', 'ring-1', 'ring-red-500', 'shake-animation');
                    mensajeError.classList.remove('hidden');
                    
                    // Quitar la animación después de que termine para que se pueda repetir si falla de nuevo
                    setTimeout(() => {
                        inputCaso.classList.remove('shake-animation');
                    }, 400);
                    return;
                }

                // Limpiar errores visuales si los hubiera
                inputCaso.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
                mensajeError.classList.add('hidden');

                // Construir la URL final
                const baseUrl = 'https://aquaservice.atlassian.net/jira/servicedesk/projects/CAU/queues/custom/9/CAU-';
                const urlFinal = baseUrl + valor;

                // Abrir en una nueva pestaña
                window.open(urlFinal, '_blank');

                // Opcional: Seleccionar el texto para buscar el siguiente rápidamente
                inputCaso.select();
            };

            // Escuchar la tecla Enter en el input
            inputCaso.addEventListener('keydown', (evento) => {
                // Verificar si la tecla presionada es 'Enter'
                if (evento.key === 'Enter') {
                    evento.preventDefault(); // Evitar comportamientos por defecto del formulario
                    procesarApertura();
                }
            });

            // Escuchar el clic en el botón
            btnAbrir.addEventListener('click', procesarApertura);
            
            // Limpiar las alertas rojas cuando el usuario empiece a escribir
            // y forzar que solo se permitan números.
            inputCaso.addEventListener('input', (evento) => {
                // Reemplazar cualquier caracter que no sea un dígito (\D) por una cadena vacía
                evento.target.value = evento.target.value.replace(/\D/g, '');

                if (inputCaso.classList.contains('border-red-500')) {
                    inputCaso.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
                    mensajeError.classList.add('hidden');
                }
            });

            // Dar foco automático al input al cargar la página
            inputCaso.focus();
        });
    </script>
</body>
</html>
