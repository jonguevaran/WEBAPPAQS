    <style>
        /* Pequeño ajuste para transiciones suaves */
        .card-enter {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">

    <!-- Cabecera y Barra de Búsqueda Fija -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm" id="main-header">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">

                    </div>

                    </div>
                </div>
                <div id="results-count" class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">
                    Cargando...
                </div>
            </div>

            <div class="relative group" id="search-container">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <!-- Icono Búsqueda -->
                    <svg class="h-5 w-5 text-slate-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Buscar por título, contenido del proceso o categoría..."
                    class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl leading-5 bg-transparent placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all sm:text-base shadow-sm"
                />
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

        <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 auto-rows-max">
            <!-- Las tarjetas se insertarán aquí con JS -->
        </div>

        <!-- Vista Detallada (Oculta por defecto) -->
        <div id="detail-view" class="hidden flex-col gap-6 card-enter">
            <div class="flex justify-between items-center w-full">
                <button id="back-btn" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Volver a los resultados
                </button>
                <button id="toggle-edit-btn" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-50 border border-indigo-200 rounded-lg text-indigo-700 hover:bg-indigo-100 transition-colors font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">

            <article class="bg-white rounded-2xl p-6 sm:p-10 shadow-sm border border-slate-200">

                    <!-- Título -->
                </h2>
                
                <div id="detail-content" class="space-y-8">
                    <!-- Contenido y pasos -->
                </div>

                <!-- Formulario Añadir Paso (Oculto por defecto) -->
                <div id="edit-step-form" class="hidden mt-8 bg-slate-50 border border-slate-200 rounded-xl p-6">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Añadir Nuevo Paso
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Descripción del paso *</label>
                            <textarea id="new-step-text" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Ej: Hacemos clic en Guardar..."></textarea>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">URL de la Imagen (opcional)</label>
                                <input type="text" id="new-step-img-url" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Ej: blob:https://... o https://...">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de la Imagen (opcional)</label>
                                <input type="text" id="new-step-img-name" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Ej: captura-1.png">
                            </div>
                        </div>

                            Añadir paso a la guía
                        </button>
                    </div>
                </div>

                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Etiquetas / Categorías</h3>
                    <div id="detail-tags" class="flex flex-wrap gap-2 mb-4">
                        <!-- Tags -->
                    </div>
                    
                    <!-- Formulario Añadir Tag (Oculto por defecto) -->
                    <div id="edit-tag-form" class="hidden flex items-center gap-2">

                        <button id="save-tag-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                            Añadir
                        </button>
                    </div>
                </div>
            </article>
        </div>

        <!-- Estado Vacío (oculto por defecto) -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 px-4 text-center">
            <div class="bg-slate-100 p-4 rounded-full mb-4">
                <!-- Icono Alerta -->
                <svg class="h-10 w-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    <line x1="12" y1="8" x2="12" y2="12"></line>

            <button

            >
                Limpiar búsqueda
            </button>
        </div>

                    "valor": "Copiamos el .EXE al escritorio del usuario final y lo ejecutamos, la primera pantalla seleccionamos \"Next\"",

                    "tipo": "texto",
                    "valor": "En la siguiente ventana solo tenemos que seleccionar el primer check \"SAP Secure Login Client\", tal y como ves en la imagen, y presionamos \"Next\".",

                      "url": "blob:https://aquaservice.atlassian.net/92cfceca-fada-4a8a-b81c-f869fe65ab6e#media-blob-url=true&id=c8ad57fc-844b-46b4-8011-d5a95d7dfa4b&clientId=717661f0-ab27-4d5c-b1a7-f5cbbe757146&contextId=contentId-910786569&collection=contentId-910786569",

                    "valor": "Una vez instalado el .exe, ejecutamos \"AutenticacionSAP.reg\" que encontramos en la misma ruta de instalación, \"M:\\Ins\\SOFTWARE\\CORPORATIVO\\SAP\\Autenticacion SAP\". Copiamos el archivo al escritorio y lo ejecutamos, aparecerá un mensaje del editor de registro que deberás aceptar presionando \"Si\"",

            {
                "ID": 28,
                "tema": "Autenticación SAP dominio",
                "descripcion": [
                  {
                    "tipo": "texto",
                    "valor": "Vamos a la aplicación de SAP e iniciamos sesión como lo hacemos habitualmente y nos dirigimos a \"Menú de usuarios > Gestión usuarios > Actualización de usuarios\". Esto se debe hacer en cada una de las interfaces de SAP (CALIDAD, DESARROLLO Y PRODUCCIÓN)",
                    "img": {
                      "url": "blob:https://aquaservice.atlassian.net/92cfceca-fada-4a8a-b81c-f869fe65ab6e#media-blob-url=true&id=8bfb58fb-e203-4742-9a52-ca1659e62b66&clientId=717661f0-ab27-4d5c-b1a7-f5cbbe757146&contextId=contentId-891912265&collection=contentId-891912265",
                      "nombre": "image-20250317-171701.png"
                    }
                  },
                  {
                    "tipo": "texto",
                    "valor": "Ahora buscamos el usuario que tenemos que configurar y entramos en su configuración con doble clic en el usuario y seleccionamos \"Modif.\" en la barra superior.",
                    "img": {
                      "url": "blob:https://aquaservice.atlassian.net/92cfceca-fada-4a8a-b81c-f869fe65ab6e#media-blob-url=true&id=c23dc95c-4b06-40bf-8e5e-0110d854df7e&clientId=717661f0-ab27-4d5c-b1a7-f5cbbe757146&contextId=contentId-891912265&collection=contentId-891912265",
                      "nombre": "image-20250317-171716.png"
                    }
                  },
                  {
                    "tipo": "texto",
                    "valor": "Una vez dentro de la configuración del usuario, seleccionamos la pestaña \"SNC\" y rellenanos el dato de \"Nombre SNC\" lo que tenemos que poner es p:CN=NOMBRE.APELLIDO@AQUASERVICE.COM, recordar que debe estar en mayúsculas. También tenemos que activar la casilla de \"Permitir acceso clave de acceso para SAP GUI\". Por último presionamos el botón de Grabar y cerramos SAP.",
                    "img": {
                      "url": "blob:https://aquaservice.atlassian.net/92cfceca-fada-4a8a-b81c-f869fe65ab6e#media-blob-url=true&id=d031ceba-dd54-4bf4-84a0-bd33e93ae3c2&clientId=717661f0-ab27-4d5c-b1a7-f5cbbe757146&contextId=contentId-891912265&collection=contentId-891912265",
                      "nombre": "image-20250317-171736.png"
                    }
                  },
                  {
                    "tipo": "texto",
                    "valor": "Volvemos a abrir SAP y hacemos click derecho sobre la entrada en la que queramos aplicarlo, (Producción, Calidad y Desarrollo).",
                    "img": {
                      "url": "blob:https://aquaservice.atlassian.net/92cfceca-fada-4a8a-b81c-f869fe65ab6e#media-blob-url=true&id=8716e7a8-0200-4c69-9153-424cbedc1cfc&clientId=717661f0-ab27-4d5c-b1a7-f5cbbe757146&contextId=contentId-891912265&collection=contentId-891912265",
                      "nombre": "image-20250317-171750.png"
                    }
                  },
                  {
                    "tipo": "texto",
                    "valor": "Una vez dentro de las propiedades vamos a la pestaña de Red y configuramos la casilla de \"Activar Secure Network Communication\" y en Nombre de SNC ponemos En DESARROLLO = \"p:CN=ASD-SNC\", En CALIDAD = \"p:CN=ASQ-SNC\", En PRODUCCIÓN = \"p:CN=ASP-SNC\". Ahora marcamos la casilla de \"Solo autenticación\" y presionamos OK para que se guarde.",
                    "img": {
                      "url": "blob:https://aquaservice.atlassian.net/92cfceca-fada-4a8a-b81c-f869fe65ab6e#media-blob-url=true&id=ae5204c0-f9d2-43ce-a75b-5d5c5824b269&clientId=717661f0-ab27-4d5c-b1a7-f5cbbe757146&contextId=contentId-891912265&collection=contentId-891912265",
                      "nombre": "image-20250317-171802.png"
                    }
                  },
                  {
                    "tipo": "texto",
                    "valor": "Por último cerramos completamente SAP y los volvemos a abrir ya debería dejar acceder sin ningún problema.",
                    "img": null
                  }
                ],
                "tags": ["SAP", "sap", "dominio-sap", "autenticacion", "SNC", "dominio", "configuracion"]
            },

        const searchContainer = document.getElementById('search-container');
        
        // Elementos de Modo Edición
        const toggleEditBtn = document.getElementById('toggle-edit-btn');
        const editBtnText = document.getElementById('edit-btn-text');
        const editStepForm = document.getElementById('edit-step-form');
        const editTagForm = document.getElementById('edit-tag-form');
        
        // Inputs de Formularios de Edición
        const newStepText = document.getElementById('new-step-text');
        const newStepImgUrl = document.getElementById('new-step-img-url');
        const newStepImgName = document.getElementById('new-step-img-name');
        const saveStepBtn = document.getElementById('save-step-btn');
        
        const newTagText = document.getElementById('new-tag-text');
        const saveTagBtn = document.getElementById('save-tag-btn');

        // === STATE VARIABLES ===
        let currentEditingItemId = null;
        let isEditModeActive = false;

        // === SVG ICONS ===
        const iconTag = `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>`;

        // === LÓGICA DE RENDERIZADO (TARJETAS COLAPSADAS) ===
        function renderCards(data) {
            resultsCount.textContent = `${data.length} ${data.length === 1 ? 'resultado' : 'resultados'}`;

            if (data.length === 0) {
                resultsGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.remove('flex');
            emptyState.classList.add('hidden');
            resultsGrid.classList.remove('hidden');

            let htmlContent = '';
            data.forEach(item => {
                let tagsHtml = '';
                item.tags.forEach(tag => {
                    tagsHtml += `
                        <button 
                            class="tag-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-50 text-indigo-700 border border-indigo-100 cursor-pointer hover:bg-indigo-100 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            data-tag="${tag}"
                            title="Filtrar por esta categoría"
                        >
                            ${iconTag}
                            ${tag}
                        </button>
                    `;
                });

                // Tarjeta colapsada (Solo título y tags)
                htmlContent += `
                    <article class="card-item card-enter bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-300 transition-all flex flex-col h-full cursor-pointer" data-id="${item.ID}">
                        <h2 class="text-lg font-bold text-slate-900 mb-4 leading-snug flex-grow">
                            ${item.tema}
                        </h2>
                        <div class="pt-4 border-t border-slate-100 flex flex-wrap gap-2 mt-auto tags-container">
                            ${tagsHtml}
                        </div>
                    </article>
                `;
            });

            resultsGrid.innerHTML = htmlContent;
        }

        // === VISTA DETALLADA ===
        function showDetail(id) {
            currentEditingItemId = parseInt(id);
            isEditModeActive = false;
            updateEditModeUI();
            
            renderDetailContent();

            // Transición de vistas
            resultsGrid.classList.add('hidden');
            searchContainer.classList.add('hidden');
            detailView.classList.remove('hidden');
            detailView.classList.add('flex');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderDetailContent() {
            const item = crmData.find(d => d.ID === currentEditingItemId);
            if (!item) return;

            // Rellenar Título
            detailTitle.textContent = item.tema;

            // Rellenar Pasos e Imágenes
            let pasosHtml = '';
            item.descripcion.forEach((paso, index) => {
                pasosHtml += `
                    <div class="flex items-start gap-4 text-slate-700 text-base">
                        <div class="flex-shrink-0 mt-1 w-6 h-6 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm">
                            ${index + 1}
                        </div>
                        <div class="flex-1 w-full overflow-hidden">
                            <p class="leading-relaxed mb-3">${paso.valor}</p>
                            ${paso.img ? `
                            <div class="mt-3 w-full bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div class="flex items-center gap-3 text-slate-700 overflow-hidden">
                                    <div class="p-2 bg-white border border-slate-200 rounded-lg text-blue-600 shadow-sm flex-shrink-0">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                    </div>
                                    <div class="min-w-0">
                                        <p class="text-sm font-semibold truncate">Imagen de referencia</p>
                                        <p class="text-xs text-slate-500 truncate" title="${paso.img.nombre}">${paso.img.nombre}</p>
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            detailContent.innerHTML = pasosHtml;

            // Rellenar Tags
            let tagsHtml = '';
            item.tags.forEach(tag => {
                tagsHtml += `
                    <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
                        ${iconTag}
                        ${tag}
                    </span>
                `;
            });
            detailTags.innerHTML = tagsHtml;
        }

        function hideDetail() {
            detailView.classList.remove('flex');
            detailView.classList.add('hidden');
            searchContainer.classList.remove('hidden');
            resultsGrid.classList.remove('hidden');
            currentEditingItemId = null;
            
            // Re-aplicar filtro actual en caso de que se hayan agregado tags
            filterData(searchInput.value);
        }

        // === MODO EDICIÓN ===
        function updateEditModeUI() {
            if (isEditModeActive) {
                editBtnText.textContent = "Cerrar Edición";
                toggleEditBtn.classList.replace('bg-indigo-50', 'bg-red-50');
                toggleEditBtn.classList.replace('text-indigo-700', 'text-red-700');
                toggleEditBtn.classList.replace('border-indigo-200', 'border-red-200');
                
                editStepForm.classList.remove('hidden');
                editTagForm.classList.remove('hidden');
            } else {
                editBtnText.textContent = "Activar Edición";
                toggleEditBtn.classList.replace('bg-red-50', 'bg-indigo-50');
                toggleEditBtn.classList.replace('text-red-700', 'text-indigo-700');
                toggleEditBtn.classList.replace('border-red-200', 'border-indigo-200');
                
                editStepForm.classList.add('hidden');
                editTagForm.classList.add('hidden');
                
                // Limpiar campos
                newStepText.value = '';
                newStepImgUrl.value = '';
                newStepImgName.value = '';
                newTagText.value = '';
            }
        }

        toggleEditBtn.addEventListener('click', () => {
            isEditModeActive = !isEditModeActive;
            updateEditModeUI();
        });

        // Guardar nuevo paso
        saveStepBtn.addEventListener('click', () => {
            const textVal = newStepText.value.trim();
            const urlVal = newStepImgUrl.value.trim();
            const nameVal = newStepImgName.value.trim();

            if (!textVal) {
                // Alerta simple por consola o lógica propia para evitar usar alert() global si hay restricciones 
                // pero lo mantenemos con una alerta nativa temporal, ideal reemplazar por modal.
                // En este caso evitamos alert o confirm según requerimientos, usaremos un console log temporal 
                // o logica de no guardar (lo dejaremos que simplemente no guarde si está vacio)
                console.warn("La descripción del paso es obligatoria.");
                return;
            }

            const item = crmData.find(d => d.ID === currentEditingItemId);
            if (item) {
                const newStep = {
                    tipo: "texto",
                    valor: textVal,
                    img: urlVal ? {
                        url: urlVal,
                        nombre: nameVal || "imagen-adjunta.png"
                    } : null
                };
                
                item.descripcion.push(newStep);
                
                // Limpiar campos y refrescar
                newStepText.value = '';
                newStepImgUrl.value = '';
                newStepImgName.value = '';
                renderDetailContent();
            }
        });

        // Guardar nuevo tag
        saveTagBtn.addEventListener('click', () => {
            const tagVal = newTagText.value.trim();
            
            if (!tagVal) return;

            const item = crmData.find(d => d.ID === currentEditingItemId);
            if (item) {
                // Evitar duplicados
                if (!item.tags.includes(tagVal)) {
                    item.tags.push(tagVal);
                }
                
                newTagText.value = '';
                renderDetailContent();
            }
        });

        // Añadir tag con Enter
        newTagText.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveTagBtn.click();
            }
        });

        // === LÓGICA DE FILTRADO ===
        function filterData(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            emptySearchTerm.textContent = term;

            if (!term) {
                renderCards(crmData);
                return;
            }

            const filtered = crmData.filter(item => {
                const matchTema = item.tema.toLowerCase().includes(term);
                const matchDesc = item.descripcion.some(d => d.valor.toLowerCase().includes(term));
                const matchTags = item.tags.some(tag => tag.toLowerCase().includes(term));

                return matchTema || matchDesc || matchTags;
            });

            renderCards(filtered);
        }

        // === EVENT LISTENERS ===
        
        // Búsqueda principal
        searchInput.addEventListener('input', (e) => {
            filterData(e.target.value);
        });

        // Limpiar búsqueda
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterData('');
            searchInput.focus();
        });

        // Eventos en el Grid (Tarjetas y Tags)
        resultsGrid.addEventListener('click', (e) => {
            // Si el clic es en un Tag
            const tagBtn = e.target.closest('.tag-btn');
            if (tagBtn) {
                e.stopPropagation(); // Evitar que se abra la tarjeta
                const tagValue = tagBtn.getAttribute('data-tag');
                searchInput.value = tagValue;
                filterData(tagValue);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // Si el clic es en la Tarjeta
            const card = e.target.closest('.card-item');
            if (card) {
                showDetail(card.getAttribute('data-id'));
            }
        });

        // Botón Volver de la vista detallada
        backBtn.addEventListener('click', () => {
            hideDetail();
        });

        // === INICIALIZACIÓN ===
        renderCards(crmData);

    </script>
</body>
</html>
