        // --- 2. Variables de Estado ---
        let currentSearch = "";
        let selectedTopicId = null;

        // Etiqueta generadora dinámica
        function getTags(item) {
            if (item.tags && Array.isArray(item.tags)) return item.tags;
            const text = `${item.tema} ${item.descripcion.map(d => d.valor).join(' ')}`.toLowerCase();
            const patterns = [
                [/(\bsap\b)/, 'SAP'],
                [/(\bcrm\b)/, 'CRM'],
                [/(\binin\b)/, 'ININ'],
                [/fortivpn/, 'FortiVPN'],
                [/(\bvpn\b)/, 'VPN'],
                [/google|gmail|2factor|authenticator/, 'Google'],
                [/salesforce/, 'Salesforce'],
                [/talkdesk/, 'Talkdesk'],
                [/power\s*bi|powerbi/, 'Power BI'],
                [/java/, 'Java'],
                [/redtrust/, 'RedTrust'],
                [/azure/, 'Azure'],
                [/(\bad\b|active directory|dominio|unidad organizativa)/, 'AD'],
                [/webserver/, 'Webserver'],
                [/cache|cach[eé]/, 'Cache'],
                [/pda/, 'PDA'],
                [/teams/, 'Teams'],
                [/odbc|obdc|base de datos|sql|db/, 'ODBC/SQL'],
                [/brevo/, 'Brevo'],
                [/excel|office|chromedriver|chrome|microsoft/, 'Microsoft'],
                [/zebra/, 'Zebra'],
                [/cmdb/, 'CMDB'],
                [/correo|mail|sms|mensajes/, 'Email'],
                [/impresora|printer/, 'Printer'],
                [/network|router|ip|puerto|puertos|internet|dns|red/, 'Network'],
                [/carpeta|a:|b:|\bcarpetas?\b/, 'File Access'],
                [/powershell|cmd|terminal|windows 11|windows/, 'Windows'],
                [/bidi/, 'BIDI'],
                [/innova|innuva|a3/, 'Innova'],
                [/gmao|linx/, 'GMAO/LINX']
            ];
            const tags = [];
            patterns.forEach(([regex, tag]) => {
                if (regex.test(text) && !tags.includes(tag)) tags.push(tag);
            });
            return tags;
        }

        // --- 3. Referencias DOM ---
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const topicList = document.getElementById('topicList');
        const resultsCount = document.getElementById('resultsCount');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const emptyState = document.getElementById('emptyState');
        const articleContent = document.getElementById('articleContent');
        const articleTitle = document.getElementById('articleTitle');
        const articleBody = document.getElementById('articleBody');
        const articleId = document.getElementById('articleId');
        const backBtn = document.getElementById('backBtn');

        // Inicializar Iconos
        lucide.createIcons();

        // --- 4. Lógica de renderizado del panel lateral ---
        function renderSidebar() {
            const searchTerm = currentSearch.toLowerCase();

            // Filtrado
            const filtered = db.filter(item => {
                const matchesTema = item.tema.toLowerCase().includes(searchTerm);
                const matchesDescripcion = item.descripcion.some(desc => desc.valor.toLowerCase().includes(searchTerm));
                const tags = getTags(item);
                const matchesTags = tags.some(tag => tag.toLowerCase().includes(searchTerm));
                return matchesTema || matchesDescripcion || matchesTags;
            });

            // Contador
            resultsCount.textContent = `${filtered.length} resultados`;

            // HTML de la lista
            topicList.innerHTML = '';
            
            if (filtered.length === 0) {
                topicList.innerHTML = `
                    <li class="p-4 text-sm text-gray-500 text-center">
                        <i data-lucide="frown" class="w-8 h-8 mx-auto mb-2 text-gray-300"></i>
                        No se encontraron temas
                    </li>`;
                lucide.createIcons();
                return;
            }

            filtered.forEach(item => {
                const li = document.createElement('li');
                const isSelected = item.ID === selectedTopicId;
                const tags = getTags(item);
                
                li.className = `cursor-pointer transition-colors border-l-4 ${isSelected ? 'bg-blue-50 border-blue-600' : 'border-transparent hover:bg-gray-100'}`;
                const tagHtml = tags.length > 0 ? `<div class="mt-2 flex flex-wrap gap-2">${tags.map(tag => `<span class="inline-flex items-center rounded-full bg-blue-100 text-blue-700 text-[10px] font-semibold uppercase tracking-wide px-2.5 py-1">${tag}</span>`).join('')}</div>` : '';
                li.innerHTML = `
                    <div class="px-4 py-3">
                        <div class="flex items-start justify-between">
                            <span class="text-xs font-semibold text-gray-400 mb-1 block">ID: ${item.ID}</span>
                        </div>
                        <h3 class="${isSelected ? 'text-blue-700 font-semibold' : 'text-gray-700 font-medium'} text-sm leading-snug line-clamp-2">
                            ${item.tema}
                        </h3>
                        ${tagHtml}
                    </div>
                `;
                
                li.addEventListener('click', () => {
                    selectedTopicId = item.ID;
                    renderSidebar(); // Para actualizar clases activas
                    renderContent();
                    
                    // Manejo en pantallas pequeñas (mostrar el contenido, ocultar la lista)
                    if (window.innerWidth < 768) {
                        sidebar.classList.add('hidden');
                        mainContent.classList.remove('hidden');
                        mainContent.classList.add('flex');
                    }
                });
                
                topicList.appendChild(li);
            });
        }

        // --- 5. Lógica de renderizado del contenido ---
        function renderContent() {
            if (!selectedTopicId) {
                emptyState.classList.remove('hidden');
                articleContent.classList.add('hidden');
                return;
            }

            const item = db.find(i => i.ID === selectedTopicId);
            if (!item) return;

            emptyState.classList.add('hidden');
            articleContent.classList.remove('hidden');

            articleId.textContent = item.ID;
            articleTitle.textContent = item.tema;
            
            // Etiquetas del artículo dentro del card abierto
            const tagContainerId = 'articleTags';
            let tagContainer = document.getElementById(tagContainerId);
            if (!tagContainer) {
                tagContainer = document.createElement('div');
                tagContainer.id = tagContainerId;
                tagContainer.className = 'mt-4 flex flex-wrap gap-2';
                articleTitle.parentElement.appendChild(tagContainer);
            }
            const tags = getTags(item);
            if (tags && tags.length > 0) {
                tagContainer.innerHTML = tags.map(tag => `<span class="inline-flex items-center rounded-full bg-blue-100 text-blue-700 text-xs font-semibold uppercase tracking-wide px-2 py-1">${tag}</span>`).join('');
                tagContainer.classList.remove('hidden');
            } else {
                tagContainer.innerHTML = '';
                tagContainer.classList.add('hidden');
            }
            
            // Reconstruir el cuerpo
            articleBody.innerHTML = '';
            
            item.descripcion.forEach(desc => {
                if (desc.tipo === 'texto') {
                    const p = document.createElement('p');
                    // Soporte simple para saltos de línea (\n) del JSON
                    p.innerHTML = desc.valor.replace(/\n/g, '<br>'); 
                    articleBody.appendChild(p);
                } else if (desc.tipo === 'imagen') {
                    const imgContainer = document.createElement('div');
                    imgContainer.className = "my-6 relative bg-gray-50 p-2 rounded-xl border border-gray-100 flex justify-center";
                    
                    const img = document.createElement('img');
                    img.src = desc.valor;
                    img.alt = `Imagen referente a: ${item.tema}`;
                    img.className = "max-w-full h-auto rounded-lg shadow-sm";
                    
                    // Fallback visual robusto si la imagen no existe en la carpeta `img/`
                    img.onerror = function() {
                        this.onerror = null; // prevenir bucles
                        this.parentElement.innerHTML = `
                            <div class="flex flex-col items-center justify-center p-8 bg-gray-100 border border-dashed border-gray-300 rounded-lg text-gray-500 w-full">
                                <i data-lucide="image-off" class="w-10 h-10 mb-2 opacity-50"></i>
                                <span class="text-sm font-medium">Imagen no encontrada en el sistema</span>
                                <span class="text-xs mt-1 font-mono text-gray-400">${desc.valor}</span>
                            </div>
                        `;
                        lucide.createIcons();
                    };
                    
                    imgContainer.appendChild(img);
                    articleBody.appendChild(imgContainer);
                }
            });
        }

        // --- 6. Eventos ---
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            clearSearchBtn.classList.toggle('hidden', currentSearch.length === 0);
            renderSidebar();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearch = '';
            clearSearchBtn.classList.add('hidden');
            searchInput.focus();
            renderSidebar();
        });

        // Botón de Volver (Móvil)
        backBtn.addEventListener('click', () => {
            sidebar.classList.remove('hidden');
            mainContent.classList.add('hidden');
            mainContent.classList.remove('flex');
            selectedTopicId = null;
            renderSidebar(); // quitar la selección visual
        });

        // Asegurar que al cambiar de tamaño de pantalla no se queden atascados los paneles
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('hidden');
                mainContent.classList.remove('hidden');
                mainContent.classList.add('flex');
            } else {
                if (selectedTopicId) {
                    sidebar.classList.add('hidden');
                } else {
                    mainContent.classList.add('hidden');
                    mainContent.classList.remove('flex');
                }
            }
        });

        // --- 7. Inicialización ---
        renderSidebar();
        renderContent();
    </script>
</body>
