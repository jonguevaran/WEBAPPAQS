<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Datos JSON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .tab-transition { transition: all 0.3s ease; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #floating-menu-container:hover { right: 1rem; opacity: 1; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .excel-table th, .excel-table td {
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            text-align: left;
            white-space: nowrap;
        }
        .excel-table th { background-color: #e0f2fe; color: #0f172a; font-weight: bold; }
        .dark .excel-table th { background-color: #1e293b; color: #e2e8f0; border-color: #475569; }
        .dark .excel-table td { border-color: #475569; }
        .excel-table th.sortable { cursor: pointer; position: relative; padding-right: 1.5rem; transition: background-color 0.2s; }
        .excel-table th.sortable:hover { background-color: #bae6fd; }
        .dark .excel-table th.sortable:hover { background-color: #334155; }
        .excel-table th.sortable::after { content: '\2195'; position: absolute; right: 8px; color: #94a3b8; opacity: 0.5; }
        .excel-table th.sortable.sorted-asc::after { content: '\2191'; color: #4f46e5; opacity: 1; }
        .excel-table th.sortable.sorted-desc::after { content: '\2193'; color: #4f46e5; opacity: 1; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 transition-colors duration-300 h-[100dvh] text-slate-800 dark:text-slate-100 font-sans p-2 sm:p-4 flex flex-col items-center justify-center overflow-hidden">

    <div id="floating-menu-container" class="fixed top-6 -right-6 opacity-70 z-50 transition-all duration-300 ease-in-out flex flex-col items-end">
        <div id="settingsMenu" class="hidden absolute right-0 mt-14 w-64 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden transform transition-all origin-top-right">
            
            <!-- Grupo 1: Personalización -->
            <div class="flex flex-col">
                <button onclick="toggleLanguage(); closeMenu();" class="w-full text-left px-4 py-3 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-3 transition-colors focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" /></svg>
                    <span id="langBtnText">Mudar para Português</span>
                </button>
                <button onclick="toggleTheme(); closeMenu();" class="w-full text-left px-4 py-3 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-3 transition-colors border-t border-slate-100 dark:border-slate-700 focus:outline-none">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    <span id="themeBtnText">Modo Escuro</span>
                </button>
            </div>

            <!-- Separador físico 20px -->
            <div class="h-[20px] bg-slate-50 dark:bg-slate-800/80 border-y border-slate-100 dark:border-slate-700"></div>

            <!-- Grupo 2: Datos (Historial) -->
            <div id="menuRegistrySection" class="hidden flex-col">
                <button onclick="loadRegistry(); closeMenu();" class="w-full text-left px-4 py-3 text-sm text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 flex items-center gap-3 transition-colors focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span id="btnMenuLoadRegistryText">Cargar Registro</span>
                </button>
                <button onclick="downloadRegistry(); closeMenu();" class="w-full text-left px-4 py-3 text-sm text-emerald-600 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-900/20 flex items-center gap-3 transition-colors border-t border-slate-100 dark:border-slate-700 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    <span id="btnMenuDownloadRegistryText">Descargar JSON</span>
                </button>
                <button onclick="deleteRegistry(); closeMenu();" class="w-full text-left px-4 py-3 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-3 transition-colors border-t border-slate-100 dark:border-slate-700 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    <span id="btnMenuDeleteRegistryText">Eliminar BD</span>
                </button>
                
                <!-- Separador físico 20px -->
                <div class="h-[20px] bg-slate-50 dark:bg-slate-800/80 border-y border-slate-100 dark:border-slate-700"></div>
            </div>

            <!-- Grupo 3: Reseteo Total -->
            <div class="flex flex-col">
                <button onclick="resetApp(); closeMenu();" class="w-full text-left px-4 py-3 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-3 transition-colors focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    <span id="resetAppBtnText">Repor Tudo</span>
                </button>
            </div>
        </div>
        <button id="menuToggleButton" onmouseenter="openMenu()" onclick="openMenu()" class="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 p-3 rounded-full shadow-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all flex items-center justify-center relative z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
    </div>

    <div class="w-full max-w-6xl h-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col border border-transparent dark:border-slate-700 transition-colors duration-300">
        <div class="bg-indigo-600 dark:bg-indigo-800 p-4 md:p-6 text-white text-center transition-colors duration-300 shrink-0">
            <h1 class="text-xl md:text-3xl font-bold flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 md:h-8 md:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>
                <span id="mainTitle">Dados</span>
            </h1>
            <p id="mainSubtitle" class="text-indigo-200 text-xs md:text-sm mt-1 md:mt-2"></p>
        </div>

        <div class="flex border-b border-slate-200 dark:border-slate-700 overflow-x-auto shrink-0">
            <button id="tab-upload-btn" onclick="switchTab('upload')" class="flex-1 min-w-[150px] py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none flex items-center justify-center gap-2">
                <span id="tab1Text">1. Carregar Dados</span>
            </button>
            <button id="tab-workspace-btn" onclick="switchTab('workspace')" class="flex-1 min-w-[150px] py-4 text-center font-semibold text-slate-500 border-b-2 border-transparent focus:outline-none flex items-center justify-center gap-2">
                <span id="tab2Text">2. Área de Trabalho</span>
            </button>
            <button id="tab-table-btn" onclick="switchTab('table')" class="flex-1 min-w-[150px] py-4 text-center font-semibold text-slate-500 border-b-2 border-transparent focus:outline-none flex items-center justify-center gap-2">
                <span id="tab3Text">3. Tabela Excel</span>
            </button>
        </div>

        <div class="flex-1 p-4 md:p-6 overflow-y-auto bg-slate-50 dark:bg-slate-900 transition-colors duration-300 relative">
            <!-- PESTAÑA 1 -->
            <div id="tab-upload" class="h-full flex-col gap-6 fade-in flex">
                <div class="flex flex-col lg:flex-row gap-6 flex-1 min-h-[400px] w-full">
                    <div class="flex flex-col flex-1">
                        <div class="flex justify-between items-end mb-2">
                            <label id="lblRawInput" class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase"></label>
                            <button onclick="copyTextArea('rawInput')" class="text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                <span id="btnCopyRawText" class="text-xs font-bold uppercase">Copiar</span>
                            </button>
                        </div>
                        <textarea id="rawInput" class="flex-1 p-4 border rounded-xl font-mono text-sm dark:bg-slate-800 dark:border-slate-600 dark:text-slate-100 resize-none h-full" placeholder="ABXO&#10;44867621A&#10;SORIANO ALVAREZ, MARIA AMPARO&#10;ATC PATERNA&#10;18/05/2026&#10;JUAN PEREZ"></textarea>
                    </div>
                    <div class="hidden lg:flex items-center justify-center text-slate-300 dark:text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
                    </div>
                    <div class="flex flex-col flex-1">
                        <div class="flex justify-between items-end mb-2">
                            <label id="lblJsonInput" class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase"></label>
                            <button onclick="copyTextArea('jsonInput')" class="text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                <span id="btnCopyJsonText" class="text-xs font-bold uppercase">Copiar</span>
                            </button>
                        </div>
                        <textarea id="jsonInput" class="flex-1 p-4 border rounded-xl font-mono text-sm dark:bg-slate-800 dark:border-slate-600 dark:text-slate-100 resize-none h-full" placeholder="[...]"></textarea>
                    </div>
                </div>
                <div class="mt-2 flex justify-end shrink-0">
                    <button onclick="handleProcess()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg transition-all flex items-center gap-2 shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" /></svg>
                        <span id="btnProcessText">Gerar e Processar</span>
                    </button>
                </div>
            </div>

            <!-- PESTAÑA 2 -->
            <div id="tab-workspace" class="hidden min-h-full flex-col lg:flex-row gap-4 md:gap-6 fade-in">
                <div class="bg-white dark:bg-slate-800 p-4 md:p-6 rounded-xl shadow-sm border dark:border-slate-700 flex flex-col w-full lg:w-5/12 xl:w-1/3 flex-1 min-h-[400px] lg:min-h-0">
                    <div class="mb-4">
                        <label id="lblRoleSelect" class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2 uppercase"></label>
                        <select id="roleSelect" onchange="onRoleSelectChange()" class="w-full p-3 border rounded-lg dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100 font-semibold text-sm">
                            <option value="" id="roleOptDefault"></option>
                            <option value="role1" id="opt_role1"></option>
                            <option value="role2" id="opt_role2"></option>
                            <option value="role3" id="opt_role3"></option>
                            <option value="role4" id="opt_role4"></option>
                            <option value="role5" id="opt_role5"></option>
                            <option value="role6" id="opt_role6"></option>
                            <option value="role7" id="opt_role7"></option>
                            <option value="role8" id="opt_role8"></option>
                            <option value="role9" id="opt_role9"></option>
                            <option value="role10" id="opt_role10"></option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between mb-3 shrink-0">
                        <h3 class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2 text-sm uppercase">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
                            <span id="accessListTitleText"></span>
                        </h3>
                        <button onclick="resetCheckboxes()" class="bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold py-1.5 px-3 text-xs rounded-md border dark:border-slate-600 transition-colors">
                            <span id="btnResetText"></span>
                        </button>
                    </div>
                    <div id="accessCheckboxes" class="space-y-2.5 flex-1 overflow-y-auto pr-2"></div>
                </div>

                <div class="flex flex-col w-full lg:w-7/12 xl:w-2/3 flex-1 min-h-[400px] lg:min-h-0 bg-white dark:bg-slate-800 p-4 md:p-6 rounded-xl shadow-sm border dark:border-slate-700 relative">
                    <div id="noDataMessage" class="hidden absolute inset-0 flex-col items-center justify-center text-center p-6 bg-white dark:bg-slate-800 rounded-xl z-10">
                        <div class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-500 p-4 rounded-full mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        </div>
                        <h3 id="noDataTitleText" class="text-lg font-bold mb-2"></h3>
                        <p id="noDataDescText" class="text-slate-500 mb-6 text-sm"></p>
                        <button onclick="switchTab('upload')" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-6 rounded-lg font-bold transition-colors"><span id="btnBackText"></span></button>
                    </div>
                    <div id="analyzerContent" class="flex-1 flex flex-col">
                        <div class="flex items-center justify-between mb-4 border-b dark:border-slate-700 pb-4 shrink-0">
                            <button id="btnPrev" onclick="prevRecord()" class="p-2 md:px-4 bg-indigo-50 dark:bg-slate-700 text-indigo-700 dark:text-indigo-300 rounded-lg flex items-center gap-2 hover:bg-indigo-100 dark:hover:bg-slate-600 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"/></svg>
                                <span id="btnPrevText" class="hidden md:inline font-bold"></span>
                            </button>
                            <span id="recordCounter" class="bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-full border dark:border-indigo-800 shadow-sm"></span>
                            <button id="btnNext" onclick="nextRecord()" class="p-2 md:px-4 bg-indigo-50 dark:bg-slate-700 text-indigo-700 dark:text-indigo-300 rounded-lg flex items-center gap-2 hover:bg-indigo-100 dark:hover:bg-slate-600 transition-colors">
                                <span id="btnNextText" class="hidden md:inline font-bold"></span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"/></svg>
                            </button>
                        </div>
                        <div class="flex items-center justify-between mb-4 shrink-0">
                            <label class="flex items-center space-x-3 cursor-pointer bg-slate-50 dark:bg-slate-700/50 px-4 py-2 rounded-lg border dark:border-slate-600 shadow-sm transition-colors hover:bg-slate-100 dark:hover:bg-slate-700">
                                <input type="checkbox" id="recordRegisteredChk" onchange="toggleRegisteredStatus()" class="form-checkbox h-5 w-5 text-green-500 rounded dark:bg-slate-900 border-slate-300">
                                <span id="chkRegisteredText" class="text-slate-700 dark:text-slate-300 font-bold uppercase tracking-wider text-[11px]"></span>
                            </label>
                            <button id="btnNextGroup" onclick="nextGroup()" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-sm transition-colors text-sm flex items-center gap-2">
                                <span id="btnNextGroupText"></span>
                            </button>
                        </div>
                        <div id="dataDisplay" class="flex-1 overflow-y-auto pr-2"></div>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA 3 -->
            <div id="tab-table" class="hidden h-full flex-col fade-in">
                <div class="bg-white dark:bg-slate-800 p-4 md:p-6 rounded-xl shadow-sm border dark:border-slate-700 flex flex-col h-full">
                    <div id="noDataTableMessage" class="hidden absolute inset-0 flex-col items-center justify-center text-center p-6 bg-white dark:bg-slate-800 rounded-xl z-10 h-full">
                        <div class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-500 p-4 rounded-full mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        </div>
                        <h3 id="noDataTableTitleText" class="text-lg font-bold mb-2"></h3>
                        <p id="noDataTableDescText" class="text-slate-500 mb-6 text-sm"></p>
                        <div class="flex gap-3 flex-wrap justify-center">
                            <button onclick="switchTab('upload')" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-6 rounded-lg font-bold transition-colors"><span id="btnBackTextTable"></span></button>
                        </div>
                    </div>
                    <div id="tableContentWrapper" class="flex-1 flex flex-col min-h-0">
                        <!-- Barra de Búsqueda -->
                        <div class="mb-4">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                                </div>
                                <input type="text" id="searchInput" onkeyup="filterTable()" class="w-full p-2.5 pl-10 border rounded-lg dark:bg-slate-900 dark:border-slate-600 dark:text-slate-100 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 shrink-0">

        function switchTab(tab) {
            ['upload', 'workspace', 'table'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`tab-${t}-btn`);
                if (t === tab) { 
                    el.classList.remove('hidden'); el.classList.add('flex'); 
                    btn.classList.replace('border-transparent', 'border-indigo-600'); btn.classList.replace('text-slate-500', 'text-indigo-600'); 
                } else { 
                    el.classList.add('hidden'); el.classList.remove('flex'); 
                    btn.classList.replace('border-indigo-600', 'border-transparent'); btn.classList.replace('text-indigo-600', 'text-slate-500'); 
                }
            });

            if (tab === 'workspace') {
                if (allParsedData.length === 0) { 
                    document.getElementById('noDataMessage').classList.remove('hidden'); 
                    document.getElementById('noDataMessage').classList.add('flex'); 
                    document.getElementById('analyzerContent').classList.add('hidden'); 
                    document.getElementById('analyzerContent').classList.remove('flex');
                } else { 
                    document.getElementById('noDataMessage').classList.add('hidden'); 
                    document.getElementById('noDataMessage').classList.remove('flex'); 
                    document.getElementById('analyzerContent').classList.remove('hidden'); 
                    document.getElementById('analyzerContent').classList.add('flex');
                    renderCurrentRecord(); 
                }
            }
            
            if (tab === 'table') {
                if (allParsedData.length === 0 && document.getElementById('excelTableBody').children.length === 0) { 
                    document.getElementById('noDataTableMessage').classList.remove('hidden'); 
                    document.getElementById('noDataTableMessage').classList.add('flex'); 
                    document.getElementById('tableContentWrapper').classList.add('hidden'); 
                    document.getElementById('tableContentWrapper').classList.remove('flex');
                } else { 
                    document.getElementById('noDataTableMessage').classList.add('hidden'); 
                    document.getElementById('noDataTableMessage').classList.remove('flex'); 
                    document.getElementById('tableContentWrapper').classList.remove('hidden'); 
                    document.getElementById('tableContentWrapper').classList.add('flex');
                }
            }
        }

        function handleProcess() {
            const rawText = document.getElementById('rawInput').value.trim();
            const jsonText = document.getElementById('jsonInput').value.trim();
            if (!rawText && !jsonText) { showAlert(currentLang === 'pt' ? 'Insira dados brutos ou JSON' : 'Ingresa dados brutos o JSON', 'error'); return; }
            if (rawText) generateJSON();
            processJSON();
        }

        function generateJSON() {
            const rawText = document.getElementById('rawInput').value;
            if(!rawText.trim()) return;
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== '');
            document.getElementById('rawInput').value = lines.join('\n');
            const results = [];
            
            const toTitleCase = (str) => str.toLowerCase().split(/\s+/).map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '').join(' ');
            
            // Logic for Pronounceable Passwords
            const components = [
                "ba", "be", "bu", "ca", "ce", "cu", "da", "de", "du", "fa", "fe", "fu", "ga", "ge", "gu", "ha", "he", "hu", "ja", "je",
                "ju", "ka", "ke", "ku", "ma", "me", "mu", "na", "ne", "nu", "pa", "pe", "pu", "qa", "qe", "qu", "ra", "re", "ru", "sa",
                "se", "su", "ta", "te", "tu", "va", "ve", "vu", "wa", "we", "wu", "xa", "xe", "xu", "ya", "ye", "yu", "za", "ze", "zu",
                "bra", "bre", "bru", "cra", "cre", "cru", "dra", "dre", "dru", "fra", "fre", "fru", "gra", "gre", "gru", "pra", "pre", "pru",
                "tra", "tre", "tru", "vrea", "vru", "bla", "ble", "blu", "sma", "sme", "smu", "ste", "stu", "que", "qui", "tra", "tre", "tru", "za", "zu"
            ];
            
            // Pool de caracteres especiales restringido exactamente a $, _, ?, !
            const specialPool = ["$", "_", "?", "!"];
            const numberPool = ["2", "3", "4", "5", "6", "7", "8", "9"];
            const getRand = (arr) => arr[Math.floor(Math.random() * arr.length)];
            
            // Detect if input uses 5 or 6 lines per record.
            let stride = 5;
            if (lines.length >= 6) {
                const dateReg = /^\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}$/;
                const hasDateAt4 = dateReg.test(lines[4]);
                if (hasDateAt4) {
                    if (lines.length >= 11) {
                        const hasDateAt9 = dateReg.test(lines[9]);
                        const hasDateAt10 = dateReg.test(lines[10]);
                        if (hasDateAt10 && !hasDateAt9) {
                            stride = 6;
                        } else if (hasDateAt9) {
                            stride = 5;
                        } else {
                            if (lines.length % 6 === 0 && lines.length % 5 !== 0) {
                                stride = 6;
                            }
                        }
                    } else {
                        if (lines.length === 6) {
                            stride = 6;
                        } else if (lines.length % 6 === 0) {
                            stride = 6;
                        }
                    }
                }
            }

            for(let i = 0; i < lines.length; i += stride) {
                if(i + (stride - 1) >= lines.length) break; 
                const iniciales = lines[i]; const dni = lines[i+1]; const nombreFull = lines[i+2]; const cargoDelegacion = lines[i+3]; const fecha = lines[i+4].replace(/\//g, '-');
                const solicitante = (stride === 6) ? lines[i+5] : "";
                
                // Procesar nombre: si tiene "*" usar ese formato, si no usar comas
                let lastnames = '', firstnames = '';
                
                if (nombreFull.includes('*')) {
                    // Formato: APELLIDOS*NOMBRES
                    const nameParts = nombreFull.split('*');
                    lastnames = (nameParts[0] || '').trim();
                    firstnames = (nameParts[1] || '').trim();
                } else if (nombreFull.includes(',')) {
                    // Formato: APELLIDOS, NOMBRES
                    const nameParts = nombreFull.split(',');
                    lastnames = (nameParts[0] || '').trim();
                    firstnames = (nameParts[1] || '').trim();
                } else {
                    // Solo un nombre
                    firstnames = nombreFull.trim();
                }
                
                let nombreSinComa, nombreNormalizado, nombresApellidos, nombreCompletoNormalizado, nombreNormalizadoSolo, apellidoNormalizado;
                
                nombreSinComa = `${toTitleCase(lastnames)} ${toTitleCase(firstnames)}`.trim();
                nombreNormalizado = `${toTitleCase(lastnames)} ${toTitleCase(firstnames)}`.trim();
                nombresApellidos = `${toTitleCase(firstnames)} ${toTitleCase(lastnames)}`.trim();
                nombreCompletoNormalizado = `${toTitleCase(firstnames)} ${toTitleCase(lastnames)}`.trim();
                nombreNormalizadoSolo = toTitleCase(firstnames);
                apellidoNormalizado = toTitleCase(lastnames);
                
                const usuario = (firstnames && lastnames) ? `${firstnames.split(' ')[0]}.${lastnames.split(' ')[0]}`.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : (firstnames || nombreFull).split(' ')[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                
                // Dividir por "," para separar cargo y delegación
                let cargo = "", delegacion = "";
                if (cargoDelegacion.includes(",")) {
                    const parts = cargoDelegacion.split(",");
                    cargo = (parts[0] || "").trim();
                    delegacion = (parts[1] || "").trim();
                } else if (cargoDelegacion.includes("*")) {
                    const parts = cargoDelegacion.split("*");
                    cargo = (parts[0] || "").trim();
                    delegacion = (parts[1] || "").trim();
                } else {
                    // Fallback: si no hay delimitador, usar el método anterior
                    const cdParts = cargoDelegacion.trim().split(/\s+/);
                    delegacion = cdParts.length > 0 ? cdParts.pop() : "";
                    cargo = cdParts.join(' ');
                }
                
                // Phonetic Password Generation Logic
                let pairs = [];
                for (let j = 0; j < 5; j++) pairs.push(getRand(components));
                pairs[0] = pairs[0].charAt(0).toUpperCase() + pairs[0].slice(1);
                
                const spec1 = getRand(specialPool);
                const spec2 = getRand(specialPool);
                
                let nums = "";
                for (let j = 0; j < 4; j++) nums += getRand(numberPool);
                
                let p1to4 = pairs.slice(0, 4).join("");
                let p5 = pairs[4];
                
                let password = p1to4 + spec1 + p5 + nums + spec2;
                
                // Adjustment logic 12-15 chars
                if (password.length > 15) {
                    let diff = password.length - 15;
                    let adjustedNums = nums.substring(0, Math.max(1, nums.length - diff));
                    password = p1to4 + spec1 + p5 + adjustedNums + spec2;
                    if (password.length > 15) {
                        password = password.substring(0, 14) + spec2;
                    }
                }

                const upperCharsApp = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let passApp = ''; for(let p=0; p<3; p++) passApp += upperCharsApp.charAt(Math.floor(Math.random() * upperCharsApp.length));
                
                // Todas las claves del JSON unificadas al español y normalizadas (usando espacios)
                results.push({
                    "Iniciales": iniciales, 
                    "DNI": dni, 
                    "Nombre Normalizado": nombreNormalizadoSolo,
                    "Apellido Normalizado": apellidoNormalizado,
                    "Nombre Completo Normalizado": nombreCompletoNormalizado,
                    "Nombres Apellidos": nombresApellidos, 
                    "Email": `${usuario}@aquaservice.com`, 
                    "Usuario": usuario, 
                    "Cargo": cargo, 
                    "Delegacion": delegacion, 
                    "Fecha": fecha, 
                    "Contraseña": password, 
                    "Contraseña APP": passApp,
                    "Solicitante": solicitante || ""
                });
            }
            document.getElementById('jsonInput').value = JSON.stringify(results, null, 2);
        }

        function processJSON() {
            const rawText = document.getElementById('jsonInput').value.trim();
            if (!rawText) return;
            try {
                const parsed = JSON.parse(rawText);
                const rawArray = Array.isArray(parsed) ? parsed : [parsed];
                let processedAll = rawArray.map(item => {
                    const enhanced = { ...item };
                    const toTitle = (str) => str.toLowerCase().split(/\s+/).map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '').join(' ');
                    
                    // Retrocompatibilidad con nombres antiguos si se carga un JSON viejo
                    if (!enhanced['Contraseña APP']) {
                        if (enhanced['PASSWORD APP']) { enhanced['Contraseña APP'] = enhanced['PASSWORD APP']; delete enhanced['PASSWORD APP']; }
                        else if (enhanced['Pass APP']) { enhanced['Contraseña APP'] = enhanced['Pass APP']; delete enhanced['Pass APP']; }
                        else enhanced['Contraseña APP'] = Array.from({length:3}, () => String.fromCharCode(65 + Math.floor(Math.random()*26))).join('');
                    }
                    return enhanced;
                });
                allParsedData = [...processedAll];
                processedAll.sort((a, b) => ((a.Cargo || "").toUpperCase() < (b.Cargo || "").toUpperCase() ? -1 : 1));
                cargoGroups = [];
                if(processedAll.length > 0) {
                    let currentCargo = processedAll[0].Cargo; let currentGroup = [];
                    processedAll.forEach(item => { if(item.Cargo === currentCargo) currentGroup.push(item); else { cargoGroups.push(currentGroup); currentCargo = item.Cargo; currentGroup = [item]; } });
                    cargoGroups.push(currentGroup);
                }
                currentGroupIndex = 0; appData = cargoGroups.length > 0 ? cargoGroups[0] : []; currentIndex = 0;
                showAlert(currentLang === 'pt' ? "Dados processados!" : "¡Datos procesados!", 'success');
                switchTab('workspace');
            } catch (e) { showAlert("Error JSON.", "error"); }
        }

        function cycleEmailInView() {
            if (appData.length === 0) return;
            const record = appData[currentIndex];
            if (!record._originalEmail) record._originalEmail = record['Email'];
            
            viewEmailCycleStep++;
            if (viewEmailCycleStep > 4) viewEmailCycleStep = 1;
            
            let originalDomain = '@aquaservice.com';
            if (record._originalEmail && record._originalEmail.includes('@')) {
                originalDomain = '@' + record._originalEmail.split('@')[1];
            }
            
            if (viewEmailCycleStep === 1) {
                record['Email'] = record._originalEmail;
            } else if (viewEmailCycleStep === 2 || viewEmailCycleStep === 3) {
                const firstNameRaw = record['Nombre Normalizado'] || '';
                const lastNameRaw = record['Apellido Normalizado'] || '';
                
                const fnParts = firstNameRaw.split(' ').filter(p => p);
                const lnParts = lastNameRaw.split(' ').filter(p => p);
                
                const firstName = fnParts[0] ? fnParts[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
                const firstLastName = lnParts[0] ? lnParts[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
                const secondLastName = lnParts[1] ? lnParts[1].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
                
                let prefix = '';
                if (viewEmailCycleStep === 2) {
                    if (firstName && secondLastName) prefix = `${firstName}.${secondLastName}`;
                    else if (firstName && firstLastName) prefix = `${firstName}.${firstLastName}`;
                    else prefix = firstName;
                } else if (viewEmailCycleStep === 3) {
                    if (firstName && firstLastName) {
                        const secondLastNameInitial = secondLastName ? secondLastName.charAt(0) : '';
                        prefix = `${firstName}.${firstLastName}${secondLastNameInitial}`;
                    } else prefix = firstName;
                }
                record['Email'] = prefix ? `${prefix}${originalDomain}` : record._originalEmail;
            } else if (viewEmailCycleStep === 4) {
                const manualEmail = prompt("Ingresa el correo manualmente:", record['Email']);
                if (manualEmail !== null && manualEmail.trim() !== "") {
                    record['Email'] = manualEmail.trim();
                } else {
                    viewEmailCycleStep = 3; // revert
                }
            }
            
            if (record['Email']) {
                record['Usuario'] = record['Email'].split('@')[0];
            }
            
            document.getElementById('jsonInput').value = JSON.stringify(allParsedData, null, 2);
            
            renderCurrentRecord();

                    showAlert(i18n[currentLang].alertPartialDuplicate, "success");

        function filterTable() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toUpperCase();
            const tbody = document.getElementById('excelTableBody');
            const trs = tbody.getElementsByTagName('tr');

            for (let i = 0; i < trs.length; i++) {
                const tdNombre = trs[i].getElementsByTagName('td')[2];
                const tdIniciales = trs[i].getElementsByTagName('td')[3];
                if (tdNombre || tdIniciales) {
                    const txtNombre = tdNombre.textContent || tdNombre.innerText;
                    const txtIniciales = tdIniciales.textContent || tdIniciales.innerText;
                    if (txtNombre.toUpperCase().indexOf(filter) > -1 || txtIniciales.toUpperCase().indexOf(filter) > -1) {
                        trs[i].style.display = "";
                    } else {
                        trs[i].style.display = "none";
                    }
                }
            }
        }

        let sortDirection = {};
        function sortTable(n, isDate = false) {
            const table = document.getElementById("generatedExcelTable");
            let rows, switching, i, x, y, shouldSwitch, dir;
            switching = true;
            dir = sortDirection[n] === "asc" ? "desc" : "asc";
            sortDirection[n] = dir;
            
            const ths = table.getElementsByTagName("th");
            for (let j = 0; j < ths.length; j++) {
                ths[j].classList.remove('sorted-asc', 'sorted-desc');
            }
            if (ths[n]) ths[n].classList.add(dir === 'asc' ? 'sorted-asc' : 'sorted-desc');

            while (switching) {
                switching = false;
                rows = table.rows;
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("td")[n];
                    y = rows[i + 1].getElementsByTagName("td")[n];
                    if (!x || !y) continue;
                    
                    let valX = x.textContent || x.innerText;
                    let valY = y.textContent || y.innerText;
                    
                    if (isDate) {
                        const parseD = (s) => { const p = s.split('-'); return p.length === 3 ? new Date(p[2], p[1]-1, p[0]).getTime() : 0; };
                        valX = parseD(valX); valY = parseD(valY);
                    } else {
                        valX = valX.toLowerCase(); valY = valY.toLowerCase();
                    }

                    if (dir === "asc") {
                        if (valX > valY) { shouldSwitch = true; break; }
                    } else if (dir === "desc") {
                        if (valX < valY) { shouldSwitch = true; break; }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                }
            }
        }

        function cycleEmailGeneration() {
            emailCycleStep++;
            if (emailCycleStep > 4) {
                emailCycleStep = 1;
            }
            
            const mailInput = document.getElementById('edit-mail');
            
            if (emailCycleStep === 1) {
                mailInput.value = originalEditMail;
            } else if (emailCycleStep === 2 || emailCycleStep === 3) {
                const nombreFull = document.getElementById('edit-nombrecompleto').value.trim();
                let lastnames = '', firstnames = '';
                
                const toTitleCase = (str) => str.toLowerCase().split(/\s+/).map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '').join(' ');
                const foundInData = allParsedData.find(item => 
                    item['Nombre Completo Normalizado'] === nombreFull.toUpperCase() ||
                    item['Nombre Completo Normalizado'] === toTitleCase(nombreFull) ||
                    item['Nombres Apellidos'] === toTitleCase(nombreFull)
                );
                
                if (nombreFull.includes('*')) {
                    const parts = nombreFull.split('*');
                    lastnames = (parts[0] || '').trim();
                    firstnames = (parts[1] || '').trim();
                } else if (nombreFull.includes(',')) {
                    const parts = nombreFull.split(',');
                    lastnames = (parts[0] || '').trim();
                    firstnames = (parts[1] || '').trim();
                } else if (foundInData) {
                    firstnames = foundInData['Nombre Normalizado'] || '';
                    lastnames = foundInData['Apellido Normalizado'] || '';
                } else {
                    const words = nombreFull.split(' ').filter(p => p);
                    if (words.length >= 3) {
                        firstnames = words.slice(0, words.length - 2).join(' ');
                        lastnames = words.slice(words.length - 2).join(' ');
                    } else if (words.length === 2) {
                        firstnames = words[0];
                        lastnames = words[1];
                    } else {
                        firstnames = nombreFull;
                    }
                }
                
                const fnParts = firstnames.split(' ').filter(p => p);
                const lnParts = lastnames.split(' ').filter(p => p);
                
                const firstName = fnParts[0] ? fnParts[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
                const firstLastName = lnParts[0] ? lnParts[0].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
                const secondLastName = lnParts[1] ? lnParts[1].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : '';
                
                if (emailCycleStep === 2) {
                    if (firstName && secondLastName) {
                        mailInput.value = `${firstName}.${secondLastName}`;
                    } else if (firstName && firstLastName) {
                        mailInput.value = `${firstName}.${firstLastName}`;
                    } else {
                        mailInput.value = firstName;
                    }
                } else if (emailCycleStep === 3) {
                    if (firstName && firstLastName) {
                        const secondLastNameInitial = secondLastName ? secondLastName.charAt(0) : '';
                        mailInput.value = `${firstName}.${firstLastName}${secondLastNameInitial}`;
                    } else {
                        mailInput.value = firstName;
                    }
                }
            } else if (emailCycleStep === 4) {
                mailInput.focus();
                mailInput.select();
            }
        }

        // Función para preseleccionar el cargo basado en el cargo del registro
        function autoSelectRoleByCargo(cargoRecord) {
            // Mapeo de cargos a roles
            const cargoToRole = {
                'role1': [/almacén|armazém|operario|auxiliar|higiene|cooler|almacenero/i],
                'role2': [/distribuidor|repartidor|rb|rz/i],
                'role3': [/instalador/i],
                'role4': [/comercial|small|sales/i],
                'role5': [/ctop/i],
                'role6': [/top(?!\s*$)/i],  // TOP pero no solamente "TOP"
                'role7': [/atc/i],
                'role8': [/sda|cobro|cobran/i],
                'role9': [/bo|ka\b/i],
                'role10': [/it(?!\s*[a-z])/i]
            };
            
            if (!cargoRecord) return;
            
            for (const [roleKey, patterns] of Object.entries(cargoToRole)) {
                for (const pattern of patterns) {
                    if (pattern.test(cargoRecord)) {
                        return roleKey;
                    }
                }
            }
            return null;
        }
        
        function resetCheckboxes() {
            const record = appData[currentIndex];
            if (record) {
                record._checkedAccesses = {};
                record._isRegistered = false;
                document.getElementById('recordRegisteredChk').checked = false;
            }
            document.querySelectorAll('.role-checkbox').forEach(c => c.checked = false);
        }
        function copyTextArea(id) { const el = document.getElementById(id); if (el.value) { navigator.clipboard.writeText(el.value); showAlert(currentLang === 'pt' ? "Copiado" : "Copiado", "success"); } }
        function copyToClipboard(k) { navigator.clipboard.writeText(appData[currentIndex][k]); showAlert(currentLang === 'pt' ? "Copiado" : "Copiado", "success"); }
        function copyFieldById(id) { const el = document.getElementById(id); if (el) { navigator.clipboard.writeText(el.textContent.trim()); showAlert(currentLang === 'pt' ? "Copiado" : "Copiado", "success"); } }
        function toTitleCaseStr(text) { return String(text || '').toLowerCase().split(/\s+/).map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '').join(' '); }
        function toggleFieldCaseById(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const current = el.textContent.trim();
            const original = el.dataset.original || current;
            const caseMode = el.dataset.caseMode || 'title';

            let newText;
            if (caseMode === 'upper-lower') {
                newText = current === current.toUpperCase() ? current.toLowerCase() : current.toUpperCase();
            } else {
                if (current === current.toUpperCase()) {
                    newText = toTitleCaseStr(original);
                } else {
                    newText = current.toUpperCase();
                }
            }
            el.textContent = newText;

            // Encontrar la clave correspondiente en el registro actual y actualizarla en memoria
            const targetKeyId = id.substring(6, id.lastIndexOf('_'));
            const record = appData[currentIndex];
            if (record) {
                const sanitizeId = (text) => String(text || '').replace(/[^a-zA-Z0-9_-]/g, '_');
                const realKey = Object.keys(record).find(k => sanitizeId(k) === targetKeyId);
                if (realKey) {
                    record[realKey] = newText;
                    
                    // Mantener sincronizados los campos de nombre completo si cambia Nombre o Apellido Normalizado
                    if (realKey === 'Nombre Normalizado' || realKey === 'Apellido Normalizado') {
                        const isUppercase = (newText === newText.toUpperCase());
                        
                        const otherKey = realKey === 'Nombre Normalizado' ? 'Apellido Normalizado' : 'Nombre Normalizado';
                        const otherTargetKeyId = sanitizeId(otherKey);
                        const otherId = `field_${otherTargetKeyId}_${id.substring(id.lastIndexOf('_') + 1)}`;
                        const otherEl = document.getElementById(otherId);
                        
                        if (otherEl) {
                            const otherCurrent = otherEl.textContent.trim();
                            const otherOriginal = otherEl.dataset.original || otherCurrent;
                            const otherNewText = isUppercase ? otherCurrent.toUpperCase() : toTitleCaseStr(otherOriginal);
                            otherEl.textContent = otherNewText;
                            record[otherKey] = otherNewText;
                        }

                        const currentName = record['Nombre Normalizado'] || '';
                        const currentLastName = record['Apellido Normalizado'] || '';
                        
                        if ('Nombre Completo Normalizado' in record) {
                            record['Nombre Completo Normalizado'] = `${currentName} ${currentLastName}`.trim();
                        }
                        if ('Nombres Apellidos' in record) {
                            record['Nombres Apellidos'] = `${currentName} ${currentLastName}`.trim();
                        }
                    }
                }
            }
        }
        function showAlert(m, type) { const box = document.getElementById('alertBox'); document.getElementById('alertMessage').textContent = m; box.classList.remove('hidden', 'translate-y-full', 'opacity-0', 'border-red-500', 'border-green-500'); box.classList.add('bg-white', type === 'error' ? 'border-red-500' : 'border-green-500'); setTimeout(() => { box.classList.add('translate-y-full', 'opacity-0'); }, 3000); }

        // Ocultar menú de ajustes al hacer clic fuera
        document.addEventListener('click', function(event) {
            const menuContainer = document.getElementById('floating-menu-container');
            const menu = document.getElementById('settingsMenu');
            if (!menu.classList.contains('hidden') && !menuContainer.contains(event.target)) {
                closeMenu();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
            const today = new Date();
            document.getElementById('input-fec-alta').value = String(today.getDate()).padStart(2, '0') + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + today.getFullYear();
            
            // Cargar iniciales guardadas en el navegador
            const savedTecnico = localStorage.getItem('savedTecnico');
            if (savedTecnico) {
                document.getElementById('input-tecnico-iniciales').value = savedTecnico;
            }

            checkRegistryVisibility(); // Verifica si existe un registro histórico para mostrar la opción de descarga
        });
    </script>
</body>
</html>
